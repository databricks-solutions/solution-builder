- id: financial-services--04-build-demo
  inputs:
    prompt: 'Build it: write the SQL/Python and capture deployed resource IDs in resources.json.'
  expectations:
    expected_facts:
    - SQL or Python implementation artifacts and resource identifiers are produced.
    - fact: resources.json is valid JSON and implementation code exists.
      verify_cmd: bash -lc 'python3 -m json.tool resources.json >/dev/null && find
        . -type f -name "*.py" -print -quit | grep -q . && echo {"ok":true}'
      verify_check: .ok == true
    assertions:
    - Build artifacts implement the approved specifications and resources.json records
      only resources actually created.
    - Live resource names use the evaluation namespace supplied in the environment
      when present.
    expected_patterns:
    - resources\.json
    - (?i)(sql|python|dashboard|genie)
    trace_expectations:
      required_tools:
      - Skill
      - Read
      - Write
      banned_tools: []
      token_budget:
        max_total: 80000
    guidelines:
    - 'Expected project stage after this step: BUILT'
    - 'Required artifacts: resources.json, **/*.{py,sql,json}'
  metadata:
    category: happy_path
    difficulty: hard
    generation_session_id: c883ee3d-ce79-5194-8273-98423bfd17ce
    regression_intent: Detects claimed builds with placeholders, missing code, dead
      resource links, or resources outside the evaluation namespace.
    sources:
