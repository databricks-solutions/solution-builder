version: '5'
test_cases:
- id: financial-services--01-capture-story
  inputs:
    prompt: Build a fraud-detection demo for a retail bank. Use synthetic credit-card
      transactions, an anomaly-detection pattern, a Genie space for ad-hoc questions,
      and an AI/BI dashboard for the trend view.
  expectations:
    expected_facts:
    - The proposed demo uses synthetic credit-card transactions, Genie, and an AI/BI
      dashboard.
    - fact: README.md and resources.json exist after story capture.
      verify_cmd: bash -lc 'test -f README.md && test -f resources.json && echo {"ok":true}'
      verify_check: .ok == true
    assertions:
    - The story has a named banking protagonist, a concrete fraud catalyst, and quantified
      business impact.
    - Synthetic transactions, the anomaly narrative, Genie questions, and dashboard
      measures form one coherent story.
    expected_patterns:
    - (?i)fraud
    - (?i)(revenue|loss|risk|\$)
    trace_expectations:
      required_tools:
      - Skill
      - Read
      - Write
      banned_tools: []
      token_budget:
        max_total: 80000
    guidelines:
    - 'Expected project stage after this step: SUMMARIZED'
    - 'Required artifacts: README.md, resources.json'
  metadata:
    category: happy_path
    difficulty: intermediate
    generation_session_id: 5edf0889-9b05-5e3d-ab3d-326591ec1a17
    regression_intent: Detects generic fraud stories whose selected products or generated
      data do not support the same investigation.
    sources:
    - type: github
      uri: repo://.claude/skills/databricks-demo-generator/SKILL.md
      title: Databricks Demo Generator workflow and coherence contract
      retrieved_at: '2026-07-17T00:00:00Z'
      snippet: Story first and coherence above all; every showcased product must earn
        a clear beat in the walkthrough.
- id: financial-services--02-design-architecture
  inputs:
    prompt: Looks good — proceed to architect the pipeline and produce architecture.md.
  expectations:
    expected_facts:
    - The project contains architecture.md.
    - fact: architecture.md exists and is not empty.
      verify_cmd: bash -lc 'test -s architecture.md && echo {"ok":true}'
      verify_check: .ok == true
    assertions:
    - The architecture connects transaction generation to governed data, Genie, and
      the dashboard without orphan components.
    expected_patterns:
    - architecture\.md
    - (?i)(genie|dashboard)
    trace_expectations:
