- id: financial-services--03-write-specifications
  inputs:
    prompt: Now write the specifications for each component (specifications/*.md).
  expectations:
    expected_facts:
    - Per-component specifications are written under specifications/.
    - fact: At least one Markdown specification exists.
      verify_cmd: bash -lc 'find specifications -name "*.md" -type f -print -quit
        | grep -q . && echo {"ok":true}'
      verify_check: .ok == true
    assertions:
    - Specifications define compatible transaction fields, fraud measures, dashboard
      visuals, and Genie questions.
    expected_patterns:
    - specifications/
    - (?i)(transaction|anomal)
    trace_expectations:
      required_tools:
      - Skill
      - Read
      - Write
      banned_tools: []
      token_budget:
        max_total: 80000
    guidelines:
    - 'Expected project stage after this step: SPECIFICATION'
    - 'Required artifacts: specifications/*.md'
  metadata:
    category: happy_path
    difficulty: intermediate
    generation_session_id: e49ead5c-4903-5c55-a315-9b62c6591b68
    regression_intent: Detects specs that are individually plausible but disagree
