bundle:
  name: "demo-prompt-generator"

# ---------------------------------------------------------------------------
# Variables — override per-target or via CLI:
#   databricks bundle deploy -t dev --var llm_endpoint=databricks-claude-sonnet-4
# ---------------------------------------------------------------------------
variables:
  llm_endpoint:
    description: "Foundation Model serving endpoint for LLM calls"
    default: "databricks-claude-sonnet-4-6"

sync:
  include:
    - .build
    - .build/app.yml
    - .build/*.whl
    - .build/requirements.txt
    - ../blocks/**
    - ../collections/**

artifacts:
  default:
    build: bun run build && ./scripts/build.sh

resources:
  database_instances:
    demo-prompt-generator-db:
      name: "demo-prompt-gen-db"
      capacity: "CU_1"

  apps:
    demo-prompt-generator-app:
      name: "demo-prompt-gen"
      description: "Demo Prompt Generator — generates Databricks demo skill packages"
      source_code_path: ./.build
      resources:
        - name: "db"
          database:
            database_name: "databricks_postgres"
            instance_name: ${resources.database_instances.demo-prompt-generator-db.name}
            permission: "CAN_CONNECT_AND_CREATE"
        - name: "llm"
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: "CAN_QUERY"
      permissions:
        - level: "CAN_USE"
          group_name: "users"

# ---------------------------------------------------------------------------
# Deploy to any workspace:
#   1. databricks auth login --host <workspace-url> --profile <name>
#   2. cd app && databricks bundle deploy -t dev --profile <name>
#   3. databricks bundle run demo-prompt-generator-app -t dev --profile <name>
#
# Prerequisites:
#   - A serving endpoint matching the llm_endpoint variable (default: databricks-claude-sonnet-4)
#   - Databricks CLI v0.239.0+ (for Apps resource support)
# ---------------------------------------------------------------------------
targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
