bundle:
  name: "demo-prompt-generator"

# ───────────────────────────────────────────────────────────────────────────
# Per-environment config lives in databricks.<target>.yml (gitignored).
# Copy databricks.prod.yml.example → databricks.prod.yml and fill in.
# ───────────────────────────────────────────────────────────────────────────
include:
  - databricks.*.yml

# Variables are declared here (no defaults) and resolved by databricks.prod.yml.
# Splitting "what" (this file) from "which values" (per-target file) keeps
# deployment-specific values out of the public repo.
variables:
  app_name:
    description: "Workspace app name (existing or new)."
  lakebase_project_id:
    description: "Lakebase autoscaling project UID (the part after /lakebase/projects/ in the UI URL)."
  lakebase_branch_id:
    description: "Lakebase branch ID inside the project (e.g. `main`, or the auto-generated `br-...` slug)."
  lakebase_database_name:
    description: "Postgres database name on the branch. Must exist (CREATE DATABASE once per fresh env)."
  anthropic_llm_endpoint:
    description: "Model name passed as Anthropic `model` field by Claude Code. Built-in FMAPI (databricks-claude-*) or a custom AI Gateway endpoint name."
  anthropic_base_path:
    description: "URL path segment after the workspace host for Claude Code. `serving-endpoints/anthropic` for FMAPI built-ins, `ai-gateway/anthropic` for custom AI Gateway endpoints."
  ai_gateway:
    description: "Direct chat-completions endpoint (LLMService 'normal' size)."
  ai_gateway_mini:
    description: "Direct chat-completions endpoint (LLMService 'mini' size)."
  ai_gateway_embedding:
    description: "Embedding endpoint (template search)."
  default_catalog:
    description: "Unity Catalog every new project lands in. Created at app boot if missing, with USE CATALOG + CREATE SCHEMA granted to `account users` and ALL PRIVILEGES granted to each admin in template_admin_emails."
  deployer_sp_client_id:
    description: "Model-3 ONLY. Deployer-SP OAuth client id. SECRET-ADJACENT: never commit a real value — the default is a placeholder; supply the real id at deploy via `export BUNDLE_VAR_deployer_sp_client_id=...`."
    default: "<set-via-BUNDLE_VAR_deployer_sp_client_id>"
  deployer_sp_client_secret:
    description: "Model-3 ONLY. Deployer-SP OAuth secret. NEVER commit a real value — the default is a placeholder; supply the real secret at deploy via `export BUNDLE_VAR_deployer_sp_client_secret=...`."
    default: "<set-via-BUNDLE_VAR_deployer_sp_client_secret>"
  mcp_caller_sp_id:
    description: "Trusted MCP server service principal application id (not a secret). The only caller allowed to name a user on /api/mcp/* (X-MCP-Caller-Email). Empty = the MCP routes refuse every deployed call. Set via `export BUNDLE_VAR_mcp_caller_sp_id=...`."
    default: ""
  app_env:
    # Runtime env injected into .build/app.yml by scripts/build.sh — keys here
    # become env vars in the deployed container. Add a key to databricks.prod.yml's
    # `app_env:` and it appears in app.yml automatically; no other edits needed.
    description: "Runtime env vars copied 1:1 into .build/app.yml's env: block."
    type: complex

sync:
  # `paths` whitelists what gets uploaded; `include` overrides .gitignore
  # for specific patterns. .build/ is gitignored (it's a build artifact dir),
  # so we explicitly include the entries we ship.
  #
  # IMPORTANT: do NOT add .build/requirements.txt here. Apps' install path
  # uses pip + Python 3.11 when requirements.txt is present, ignoring our
  # pyproject.toml. We ship pyproject.toml + uv.lock so Apps uses uv +
  # Python 3.12 (see scripts/build.sh).
  paths:
    - .build
  include:
    - .build/app.yml
    - .build/start.sh
    - .build/*.whl
    - .build/pyproject.toml
    - .build/uv.lock
    - .build/.claude/**
    # Per-template archives (<slug>.tmpl — zips with a non-.zip extension so the
    # workspace does NOT auto-expand them into thousands of loose files, which made
    # the Apps source-copy take ~9 min). start.sh unzips them into the runtime
    # templates dir on boot. Not in the wheel (over the Apps 10 MB export cap).
    - .build/initial_templates_zips/**

artifacts:
  default:
    # build.sh reads the resolved bundle target's `env:` block and writes
    # .build/app.yml from it — the running container's env is a 1:1 copy of
    # `targets.<target>.env` in databricks.prod.yml.
    build: ./scripts/build.sh --target ${bundle.target}

resources:
  # ───────────────────────────────────────────────────────────────────────────
  # Lakebase project + branch are NOT managed by this bundle today.
  #
  # Why: this workspace has hit the 1000-project Lakebase quota, and the
  # `postgres_projects` resource only knows how to CREATE (project_id is a
  # slug, not a UID — it can't bind to an existing project). The block below
  # is the right shape for a fresh workspace; uncomment it and switch the
  # vars to slugs (e.g. `demo-generator` / `production`) when quota allows.
  #
  # Until then, point at an existing project via UID in databricks.prod.yml's
  # var.lakebase_project_id + var.lakebase_branch_id.
  #
  # Manual one-time setup per fresh deploy environment:
  #   1. After the App is deployed (and the SP exists), grant it
  #      CAN_CONNECT_AND_CREATE on the project via the Lakebase UI.
  # The database itself is auto-created by core/lakebase.py on first boot
  # (CREATE DATABASE via the always-present `databricks_postgres` maintenance DB).
  # ───────────────────────────────────────────────────────────────────────────
  # postgres_projects:
  #   main:
  #     project_id: ${var.lakebase_project_id}     # slug, e.g. demo-generator
  #     display_name: ${var.app_name}
  #     pg_version: 17
  #     enable_pg_native_login: true
  #
  # postgres_branches:
  #   prod:
  #     parent: ${resources.postgres_projects.main.id}
  #     branch_id: ${var.lakebase_branch_id}        # slug, e.g. production
  #     is_protected: true
  #     no_expiry: true

  apps:
    demo-prompt-generator-app:
      name: ${var.app_name}
      description: "Demo Prompt Generator — generates Databricks demo skill packages"
      source_code_path: ./.build
      # User Authorization (OBO) OAuth scopes requested on the acting user's
      # downscoped x-forwarded-access-token. Declared here so they SURVIVE
      # redeploys — otherwise editing any app setting (or a redeploy) resets
      # User Authorization to just the two built-in defaults
      # (iam.access-control:read, iam.current-user:read) and drops these.
      #
      # The deploy path itself needs NO OBO scope — ALL resource deploys run as
      # the DEPLOYER SP against the target (subprocess_auth_env target_deploy
      # branch), and metadata/embeddings LLM calls run as the APP SP. The OBO
      # scopes below cover the agent's metadata reads (catalog/schema/table
      # listing) during builds. The Apps user_api_scopes API REJECTS the literal
      # `unity-catalog` ("not a valid scope") and `catalog`, accepting only the
      # granular `catalog.*` family — so we request the full granular UC set,
      # the grantable superset of the connections capability. This workspace
      # REJECTS `all-apis`/`iam.*`.
      # GENERIC scopes only — the agent's OBO calls read catalog metadata during
      # builds in EVERY tier. DAB APPENDS target user_api_scopes to this base list.
      user_api_scopes:
        - catalog.catalogs
        - catalog.schemas
        - catalog.tables
      # NOTE on the Lakebase grant: even with TF 1.15.0, Apps' grant API rejects
      # autoscaling project slugs ("Database instance X does not exist") — it
      # only knows legacy Lakebase Provisioned instances. So no `database`
      # grant here; SP auth is wired via PG role + workspace CAN_USE grant
      # done out-of-band (see deploy steps below).
      resources:
        # `ai-gateway` (the main chat endpoint) intentionally NOT bound here.
        # The `serving_endpoint` resource binding only knows Mosaic AI Model
        # Serving / FMAPI endpoints (at /api/2.0/serving-endpoints/...).
        # Custom AI Gateway endpoints live under a separate API
        # (/ai-gateway/...) and `bundle deploy` fails with "Endpoint with
        # name 'X' does not exist." when the var points at one (we hit this
        # with `demo-generator-do-not-delete`). Workaround: grant the App
        # SP CAN_QUERY on the AI Gateway endpoint manually via the AI
        # Gateway UI. The two bindings below are FMAPI endpoints, which
        # ARE supported.
        # - name: "ai-gateway"
        #   serving_endpoint:
        #     name: ${var.ai_gateway}
        #     permission: "CAN_QUERY"
        - name: "ai-gateway-mini"
          serving_endpoint:
            name: ${var.ai_gateway_mini}
            permission: "CAN_QUERY"
        - name: "ai-gateway-embedding"
          serving_endpoint:
            name: ${var.ai_gateway_embedding}
            permission: "CAN_QUERY"
      permissions:
        - level: "CAN_USE"
          group_name: "users"

# ───────────────────────────────────────────────────────────────────────────
# Deploy (first time on a fresh workspace):
#   1. databricks auth login --host <workspace-url> --profile <name>
#   2. cp databricks.prod.yml.example databricks.prod.yml ; fill it in.
#   3. databricks bundle deploy           # creates project, branch, app
#   4. psql against the branch's endpoint, run:
#         CREATE DATABASE <lakebase_database_name>;
#      (one-time, until DAB ships a postgres_databases resource).
#   5. Lakebase UI → project → Permissions: grant the App's SP
#      CAN_CONNECT_AND_CREATE.
#   6. databricks bundle run demo-prompt-generator-app   # restart, table init.
#
# Subsequent deploys: just step 3.
#
# Notes:
# - ${var.anthropic_llm_endpoint} (Claude Code) does NOT need a CAN_QUERY
#   grant — it routes through /serving-endpoints/anthropic, which all workspace
#   users (including SPs) can call. It's only an env var in app_env.
# - LAKEBASE_DATABASE_PATH inside app_env is composed from the three lakebase_*
#   vars so the running container gets the full path with one substitution.
# ───────────────────────────────────────────────────────────────────────────
targets:
  prod:
    mode: production
    default: true
    # SHARED root_path (not per-user) so a re-deploy from a different machine /
    # user / CI overwrites the SAME workspace tree instead of creating a shadow
    # copy under each deployer's home — better for multi-user deploys. The CLI
    # lays out files/, state/, artifacts/ as subdirs under this path itself —
    # don't include any of those segments here. (Requires deployers to have
    # write access to the shared folder.)
    workspace:
      root_path: /Workspace/solution_builder/.bundle/${bundle.name}/${bundle.target}
  # Staging target. Use `databricks bundle deploy -t staging` (no default).
  # `mode: production` (not development): the root_path below is SHARED (no
  # ${workspace.current_user.userName}) so any machine redeploys the same
  # bundle — and `mode: development` REQUIRES the username in root_path for
  # uniqueness, which would defeat the shared path. Production mode also skips
  # the `[dev <user>]` name-prefixing, so the App keeps its declared name
  # (`dbdemos-generator-staging`); `presets.name_prefix: ""` is kept as a
  # belt-and-braces no-op. This mirrors the prod target's shared-root pattern.
  staging:
    mode: production
    presets:
      name_prefix: ""
    workspace:
      root_path: /Workspace/solution_builder/.bundle/${bundle.name}_staging/${bundle.target}
