bundle:
  name: "demo-prompt-generator"

sync:
  include:
    - .build

artifacts:
  default:
    build: apx build

resources:
  database_instances:
    demo-prompt-generator-db:
      name: "demo-prompt-generator"
      capacity: "CU_1"
  apps:
    demo-prompt-generator-app:
      name: "demo-prompt-generator"
      description: "Demo Prompt Generator — generates Databricks demo skill packages"
      source_code_path: ./.build
      resources:
        - name: "db"
          database:
            database_name: "databricks_postgres"
            instance_name: ${resources.database_instances.demo-prompt-generator-db.name}
            permission: "CAN_CONNECT_AND_CREATE"
        - name: "llm"
          serving_endpoint:
            name: "databricks-claude-sonnet-4"
            permission: "CAN_QUERY"

# Deploy to any workspace:
#   1. Configure a CLI profile:  databricks auth login --host <workspace-url> --profile <name>
#   2. Deploy:                   databricks bundle deploy -t dev --profile <name>
#
# The bundle will create a Lakebase instance and app automatically.
# The serving endpoint "databricks-claude-sonnet-4" must exist on the target workspace.
targets:
  dev:
    mode: development
    default: true
