bundle:
  name: "demo-prompt-generator"

# ---------------------------------------------------------------------------
# Variables — override per-target or via CLI:
#   databricks bundle deploy -t dev --var llm_endpoint=databricks-claude-sonnet-4
# ---------------------------------------------------------------------------
variables:
  llm_endpoint:
    description: "Foundation Model serving endpoint for LLM calls"
    default: "databricks-claude-sonnet-4-6"
  summarization_endpoint:
    description: "Serving endpoint for summarization (cheap/fast model)"
    default: "databricks-gpt-5-4-mini"
  embedding_endpoint:
    description: "Serving endpoint for embeddings (template search)"
    default: "databricks-qwen3-embedding-0-6b"
  lakebase_instance:
    description: "Existing Lakebase instance to reuse (SP gets its own schema)"
    default: "databricks-demos-shared"

sync:
  include:
    - .build
    - .build/app.yml
    - .build/*.whl
    - .build/requirements.txt

artifacts:
  default:
    build: ./scripts/build.sh

resources:
  apps:
    demo-prompt-generator-app:
      name: "demo-prompt-gen-cal"
      description: "Demo Prompt Generator — generates Databricks demo skill packages"
      source_code_path: ./.build
      resources:
        - name: "db"
          database:
            database_name: "databricks_postgres"
            instance_name: ${var.lakebase_instance}
            permission: "CAN_CONNECT_AND_CREATE"
        - name: "llm"
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: "CAN_QUERY"
        - name: "summarization"
          serving_endpoint:
            name: ${var.summarization_endpoint}
            permission: "CAN_QUERY"
        - name: "embedding"
          serving_endpoint:
            name: ${var.embedding_endpoint}
            permission: "CAN_QUERY"
      permissions:
        - level: "CAN_USE"
          group_name: "users"

# ---------------------------------------------------------------------------
# Deploy:
#   1. databricks auth login --host <workspace-url> --profile <name>
#   2. cd app && databricks bundle deploy -t dev --profile <name>
#
# The app uses Databricks Foundation Model API (FMAPI) to run Claude Code —
# no Anthropic API key needed. The service principal authenticates via OAuth
# and routes through /serving-endpoints/anthropic on the workspace.
#
# Prerequisites:
#   - Databricks CLI v0.239.0+
#   - A Foundation Model endpoint matching llm_endpoint (default: databricks-claude-sonnet-4-6)
# ---------------------------------------------------------------------------
targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
