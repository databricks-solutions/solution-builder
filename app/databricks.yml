bundle:
  name: "demo-prompt-generator"

sync:
  include:
    - .build

artifacts:
  default:
    build: apx build

resources:
  database_instances:
    demo-prompt-generator-db:
      name: "demo-prompt-generator"
      capacity: "CU_1"
  apps:
    demo-prompt-generator-app:
      name: "demo-prompt-generator"
      description: "demo-prompt-generator created with apx"
      source_code_path: ./.build
      resources:
        - name: "db"
          database:
            database_name: "databricks_postgres"
            instance_name: ${resources.database_instances.demo-prompt-generator-db.name}
            permission: "CAN_CONNECT_AND_CREATE"

targets:
  dev:
    mode: development
    default: true
