[project]
name = "demo-prompt-generator"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk[openai]>=0.74.0",
    "sqlmodel>=0.0.27",
    "psycopg[binary,pool]>=3.2.11",
    "pglite>=0.2.0",
    "httpx>=0.28.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.22",
    "claude-agent-sdk>=0.1.50",
    "pyyaml>=6.0",
    "watchdog>=4.0.0",
    # MCP tools dependencies
    "mcp>=1.0.0",
    "fastmcp==3.1.1",
    "sqlglot>=20.0.0",
    "sqlfluff>=3.0.0",
    "plutoprint==0.19.0",
    "alembic",
    # Data-generation helpers used by the demo-building agent.
    "databricks-connect>=16.1,<17",
    "faker>=30.0",
    "holidays>=0.55",
]

# Local path dependencies for Databricks MCP tools
[tool.uv.sources]
databricks-mcp-server = { path = "ai_dev_kit/databricks-mcp-server", editable = true }

[dependency-groups]
dev = [
    "ty>=0.0.12",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "src/demo_prompt_generator/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/demo_prompt_generator/__dist__", "src/demo_prompt_generator/_metadata.py"]
exclude = ["src/demo_prompt_generator/ui"]
