<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    @keyframes cs-a { 0%,100% { transform: translate(0,0); } 50% { transform: translate(0.6px,-0.9px); } }
    @keyframes cs-b { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-0.7px,0.6px); } }
    @keyframes cs-c { 0%,100% { transform: translate(0,0); } 50% { transform: translate(0.5px,0.8px); } }
