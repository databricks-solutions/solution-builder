version: 1.1

source: ai_demo_gen.demo_luxebeauty_test.gold_daily_summary

dimensions:
  - name: date
    expr: date
  - name: region
    expr: region
  - name: category
    expr: category

measures:
  - name: total_revenue
    expr: SUM(revenue_usd)
  - name: total_refunds
    expr: SUM(returns_usd)
  - name: order_count
    expr: SUM(order_count)
  - name: return_count
    expr: SUM(return_count)
  - name: return_rate
    expr: "SUM(return_count) / NULLIF(SUM(order_count), 0)"
  - name: refund_rate
    expr: "SUM(returns_usd) / NULLIF(SUM(revenue_usd), 0)"
