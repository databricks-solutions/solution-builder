# Larkspur Health — hospital care transitions & readmission reduction (Readmission Copilot) — complete DAB.
#
# Recreates the whole demo on ANY workspace / catalog / schema (everything is a variable). Nothing is
# created by hand: the bundle owns the Lakebase database, the AI/BI dashboard, the Databricks App and the
# setup job; the setup job builds the data, the model, the Genie agent (tables + documents volume).
#
#   databricks bundle deploy  → Lakebase database + dashboard + app (resource) + setup job
#   databricks bundle run readmission_setup
#       generate_data (schema + synthetic discharges, notes, HRRP inputs)
#       → extract_note_insights (AI Functions: ai_query with a typed schema over every discharge note)
#       → build_gold (gold discharges, monthly rates, follow-up effect, HRRP ERR + penalty estimate)
#       → train_readmission_model (UC model @champion + discharge_risk_scores + transition_worklist view)
#       upload_care_pathways (pathway docs → care_pathways volume)
#       → deploy_genie (Genie agent over the gold tables + that volume; waits for the documents index) → grant_app (UC + Genie permissions for the app SP)
#       → export_resources (demo_resources table the app reads at boot + exit JSON)
#   databricks bundle run readmission_app   → deploys the app source and starts it
#
# See dab_instructions.md.

bundle:
  name: hls_readmission_copilot

variables:
  catalog:
    description: Unity Catalog for the demo data
    default: healthcare_lifesciences
  schema:
    description: Schema for demo tables, the ML model and the care_pathways volume
    default: readmission_reduction
  warehouse_id:
    description: Serverless SQL warehouse (dashboard, Genie, app analytics, AI Functions) — pass --var warehouse_id=<id>
  workspace_folder:
    description: Workspace folder holding the bundle, dashboard, Genie space and ML experiment
    default: /Workspace/Users/${workspace.current_user.userName}/hls-readmission-reduction
  app_name:
    description: Databricks App name (unique per workspace, <= 30 chars)
    default: readmission-copilot
  lakebase_project_slug:
    description: Existing Lakebase (autoscaling) project the app database lives in
  lakebase_branch_id:
    default: production
  lakebase_database:
    description: Postgres database name created by the bundle for the app
  lakebase_owner_role:
    description: >-
      Postgres role id (on the branch) that owns the database. Non-personal: a GROUP role for the
      workspace `admins` group, created once per Lakebase project (see dab_instructions.md).
  memo_model:
    description: Chat-completions model for the transition-plan summary + call script
    default: databricks-claude-sonnet-4-5

workspace:
  root_path: ${var.workspace_folder}/.bundle/${bundle.target}

artifacts:
  app:
    build: ./app/scripts/build-app.sh

sync:
  include:
    - "src/**"
    - "app/dist/**"
    - "app/client/dist/**"
    - "app/drizzle/**"
    - "app/shared/**"
    - "app/package.json"        # the repo-root .gitignore ignores package*.json — the Apps
    - "app/package-lock.json"   # container needs both to npm install
  # app/.env*, .preview.pgid, playwright output are already skipped via app/.gitignore
  exclude:
    - "app/node_modules/**"
    - "app/tests/**"
    - "template_screenshot*.png"

targets:
  # Portable default (forks, Solution Builder "Download DAB"): NO pinned host — deploys to whatever workspace your
  # profile points at. See dab_instructions.md ("Deploy to your own workspace").
  # The bundle creates the app's Lakebase database in an EXISTING Lakebase project (defaults: project `<project>`,
  # owner role `admins`; override with --var lakebase_project_slug / lakebase_owner_role).
  #   databricks bundle deploy -p <profile> --var warehouse_id=<id> [--var catalog=… --var schema=… --var lakebase_project_slug=… --var lakebase_owner_role=…]
  default:
    default: true

resources:
  experiments:
    agent_traces:
      # The app's agent traces (MLflow tracing). Bundle-owned so it lives in the demo folder and the app SP gets
      # CAN_EDIT through the app resource below (the SP can't create experiments in a folder it doesn't own).
      name: ${var.workspace_folder}/${var.app_name}-agent-traces

  postgres_databases:
    readmission_db:
      parent: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
      database_id: db-${var.app_name}
      postgres_database: ${var.lakebase_database}
      role: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}/roles/${var.lakebase_owner_role}

  dashboards:
    readmission_dashboard:
      display_name: "Larkspur Health - Readmissions & HRRP Exposure"
      file_path: ./dashboard/readmissions_hrrp.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.workspace_folder}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      embed_credentials: true

  apps:
    readmission_app:
      name: ${var.app_name}
      description: "Larkspur Health Readmission Copilot — care-transitions command center: 30-day readmission risk model, AI-read discharge notes, HRRP penalty exposure, care-pathway transition plans and outreach tasks written back to Lakebase"
      source_code_path: ./app
      config:
        command: ["node", "--env-file-if-exists=.env", "dist/server.js"]
        env:
          - name: NODE_ENV
            value: production
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: WAREHOUSE_ID
            value_from: sql-warehouse
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: DEMO_CATALOG
            value: ${var.catalog}
          - name: DEMO_SCHEMA
            value: ${var.schema}
          - name: DASHBOARD_ID
            value: ${resources.dashboards.readmission_dashboard.id}
          - name: MEMO_MODEL
            value: ${var.memo_model}
          - name: AGENT_MLFLOW_EXPERIMENT_PATH
            value: ${resources.experiments.agent_traces.name}
          - name: LAKEBASE_PROJECT_ID
            value: ${var.lakebase_project_slug}
          # GENIE_SPACE_ID is NOT set here: the setup job creates the Genie agent and writes its id
          # to <catalog>.<schema>.demo_resources, which the app reads at boot.
      user_api_scopes:
        - serving.serving-endpoints
        - ai-gateway
        - dashboards.genie
        - sql
        - sql.statement-execution
        - postgres
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
            database: ${resources.postgres_databases.readmission_db.name}
            permission: CAN_CONNECT_AND_CREATE
        - name: agent-traces
          experiment:
            experiment_id: ${resources.experiments.agent_traces.id}
            permission: CAN_EDIT

  jobs:
    readmission_setup:
      name: "[HLS] Readmission Copilot - Setup"
      description: "Synthetic discharges + notes → AI Functions over discharge notes → gold + HRRP estimate → readmission risk model (UC) → Genie agent (tables + docs) → app grants"
      tasks:
        - task_key: generate_data
          spark_python_task:
            python_file: ./data_generation/generate_data.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

        - task_key: extract_note_insights
          depends_on: [{task_key: generate_data}]
          spark_python_task:
            python_file: ./src/ai/extract_note_insights.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

        - task_key: build_gold
          depends_on: [{task_key: extract_note_insights}]
          spark_python_task:
            python_file: ./src/gold/build_gold.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

        - task_key: train_readmission_model
          depends_on: [{task_key: build_gold}]
          spark_python_task:
            python_file: ./src/ml/train_readmission_model.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}",
                         "--experiment", "${var.workspace_folder}/readmission_model_experiment"]
          environment_key: ml

        - task_key: upload_care_pathways
          depends_on: [{task_key: generate_data}]
          notebook_task:
            notebook_path: ./src/deploy/upload_care_pathways.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}
          environment_key: default

        - task_key: deploy_genie
          depends_on: [{task_key: train_readmission_model}, {task_key: upload_care_pathways}]
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              warehouse_id: "${var.warehouse_id}"
              parent_path: "${var.workspace_folder}"
          environment_key: sdk_latest

        - task_key: grant_app
          depends_on: [{task_key: deploy_genie}]
          notebook_task:
            notebook_path: ./src/deploy/grant_app_uc.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              app_name: "${var.app_name}"
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
          environment_key: sdk_latest

        - task_key: export_resources
          depends_on: [{task_key: grant_app}]
          notebook_task:
            notebook_path: ./src/deploy/export_resources.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              app_name: "${var.app_name}"
              dashboard_id: "${resources.dashboards.readmission_dashboard.id}"
              warehouse_id: "${var.warehouse_id}"
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
              documents_volume: "{{tasks.deploy_genie.values.documents_volume}}"
              agent_mlflow_experiment_path: "${resources.experiments.agent_traces.name}"
          environment_key: sdk_latest

      environments:
        - environment_key: default
          spec:
            client: "4"
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - "mlflow>=3.1"
              - "scikit-learn>=1.5"
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - "databricks-sdk>=0.114.0"
