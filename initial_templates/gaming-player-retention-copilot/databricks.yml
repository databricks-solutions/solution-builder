# Emberline Studios — Hollowspire Live-Ops Console (player retention copilot) — complete DAB.
#
# Recreates the whole demo on ANY workspace / catalog / schema (everything is a variable). Nothing is
# app's agent-traces experiment, the Databricks App and the setup job; the setup job builds the data, the
# models and the Genie space:
#
#   databricks bundle deploy  → Lakebase database + dashboard + experiment + app (resource) + setup job
#   databricks bundle run player_retention_setup
#       generate_data (schema + synthetic telemetry) → chat_toxicity (AI Functions on the warehouse)
#       → train_models (XGBoost churn + LTV, UC @champion, SHAP → churn_scores, gold_risk_segments)
#       → deploy_genie → grant_app_uc (UC + Genie grants for the app SP)
#       → export_resources (demo_resources table the app reads at boot + exit JSON)
#   databricks bundle run liveops_app   → deploys the app source and starts it
#
# See dab_instructions.md.

bundle:
  name: gaming_player_retention_copilot

variables:
  catalog:
    description: Unity Catalog for the demo data
    default: gaming
  schema:
    description: Schema for demo tables and the UC models
    default: player_retention_copilot
  warehouse_id:
    description: Serverless SQL warehouse (dashboard, Genie, AI Functions, app analytics) — pass --var warehouse_id=<id>
  workspace_folder:
    description: Workspace folder holding the bundle, dashboard, Genie space and MLflow experiment
    default: /Workspace/Users/${workspace.current_user.userName}/gaming-player-retention-copilot
  app_name:
    description: Databricks App name (unique per workspace, <= 30 chars)
    default: player-retention-copilot
  lakebase_project_slug:
    description: Existing Lakebase (autoscaling) project the app database is created in
  lakebase_branch_id:
    default: production
  lakebase_database_id:
    description: >-
      Legacy `demo` target only: id of the Lakebase database created by app/scripts/lakebase_setup_db.sh.
  lakebase_database:
    description: Postgres database name created by the bundle for the app
  lakebase_owner_role:
    description: >-
      Postgres role id (on the branch) that owns the bundle-created database. Non-personal: a group role, not a personal one.

workspace:
  root_path: ${var.workspace_folder}/.bundle/${bundle.target}

artifacts:
  app:
    build: ./app/scripts/build-app.sh

sync:
  include:
    - "src/**"
    - "app/dist/**"
    - "app/client/dist/**"
    - "app/drizzle/**"
    - "app/package.json"        # the repo-root .gitignore ignores package*.json — the Apps
    - "app/package-lock.json"   # container needs both to npm install
  exclude:
    - "app/node_modules/**"
    - "app/.env"
    - "app/.env.*"
    - "app/.preview.pgid"
    - "app/playwright-report/**"
    - "app/test-results/**"
    - "app/tests/**"
    - "template_screenshot*.png"

targets:
  # Portable default (forks, Solution Builder "Download DAB"): NO pinned host — deploys to whatever workspace your
  # profile points at. See dab_instructions.md ("Deploy to your own workspace").
  # The bundle creates the app's Lakebase database in an EXISTING Lakebase project (defaults: project `<project>`,
  # owner role `admins`; override with --var lakebase_project_slug / lakebase_owner_role).
  #   databricks bundle deploy -p <profile> --var warehouse_id=<id> [--var catalog=… --var schema=… --var lakebase_project_slug=… --var lakebase_owner_role=…]
  default:
    default: true
    resources:
      postgres_databases:
        liveops_db:
          parent: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
          database_id: db-${var.app_name}                 # unique in <project> (app names are unique)
          postgres_database: ${var.lakebase_database}
          role: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}/roles/${var.lakebase_owner_role}
      apps:
        liveops_app:
          resources:
            # Merged by name with the top-level app resources: only the postgres binding changes (bundle-owned DB).
            - name: postgres
              postgres:
                branch: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
                database: ${resources.postgres_databases.liveops_db.name}
                permission: CAN_CONNECT_AND_CREATE

resources:
  experiments:
    agent_traces:
      # The app's agent traces (MLflow tracing). Bundle-owned so it lives in the demo folder and the app SP gets
      # CAN_EDIT through the app resource below (the SP can't create experiments in a folder it doesn't own).
      name: ${var.workspace_folder}/${var.app_name}-agent-traces

  dashboards:
    liveops_dashboard:
      display_name: "Hollowspire - Season 7 Live-Ops & Player Retention"
      file_path: ./dashboard/liveops_retention.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.workspace_folder}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      embed_credentials: true

  apps:
    liveops_app:
      name: ${var.app_name}
      description: "Hollowspire Live-Ops Console — churn + LTV models with SHAP drivers, AI Functions on chat toxicity, and a live-ops copilot that plans and schedules interventions within budget"
      source_code_path: ./app
      # App runtime config (replaces app/app.yaml, so no resource ID is hand-edited into the app source).
      # GENIE_SPACE_ID is NOT set: the setup job creates the space and writes its id to
      # <catalog>.<schema>.demo_resources, which the app reads at boot (server/services/resources.ts).
      config:
        command: ["node", "--env-file-if-exists=.env", "dist/server.js"]
        env:
          - {name: NODE_ENV, value: production}
          - {name: DATABRICKS_WAREHOUSE_ID, value_from: sql-warehouse}
          - {name: WAREHOUSE_ID, value_from: sql-warehouse}
          - {name: LAKEBASE_ENDPOINT, value_from: postgres}
          - {name: DEMO_CATALOG, value: "${var.catalog}"}
          - {name: DEMO_SCHEMA, value: "${var.schema}"}
          - {name: DASHBOARD_ID, value: "${resources.dashboards.liveops_dashboard.id}"}
          - {name: LAKEBASE_PROJECT_ID, value: "${var.lakebase_project_slug}"}
          - {name: AGENT_MLFLOW_EXPERIMENT_PATH, value: "${resources.experiments.agent_traces.name}"}
      user_api_scopes:
        - serving.serving-endpoints
        - ai-gateway
        - dashboards.genie
        - sql
        - sql.statement-execution
        - postgres
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
            database: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}/databases/${var.lakebase_database_id}
            permission: CAN_CONNECT_AND_CREATE
        - name: agent-traces
          experiment:
            experiment_id: ${resources.experiments.agent_traces.id}
            permission: CAN_EDIT

  jobs:
    player_retention_setup:
      name: "[GAMING] Player Retention Copilot - Setup"
      description: "Synthetic telemetry → AI Functions over chat → churn + LTV models (UC) → Genie → app grants"
      tasks:
        - task_key: generate_data
          spark_python_task:
            python_file: ./data_generation/generate_data.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

        - task_key: chat_toxicity
          depends_on: [{task_key: generate_data}]
          spark_python_task:
            python_file: ./src/deploy/run_sql_on_warehouse.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}",
                         "--warehouse_id", "${var.warehouse_id}", "--sql_file", "${workspace.file_path}/src/ai/chat_toxicity.sql"]
          environment_key: sdk_latest

        - task_key: train_models
          depends_on: [{task_key: chat_toxicity}]
          spark_python_task:
            python_file: ./src/ml/train_models.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}",
                         "--experiment", "${var.workspace_folder}/player_models_experiment"]
          environment_key: ml

        - task_key: deploy_genie
          depends_on: [{task_key: train_models}]
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              warehouse_id: "${var.warehouse_id}"
              parent_path: "${var.workspace_folder}"
          environment_key: sdk_latest

        - task_key: grant_app_uc
          depends_on: [{task_key: train_models}]
          notebook_task:
            notebook_path: ./src/deploy/grant_app_uc.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}", app_name: "${var.app_name}"}
          environment_key: sdk_latest

        - task_key: export_resources
          depends_on: [{task_key: deploy_genie}, {task_key: grant_app_uc}]
          notebook_task:
            notebook_path: ./src/deploy/export_resources.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              app_name: "${var.app_name}"
              dashboard_id: "${resources.dashboards.liveops_dashboard.id}"
              warehouse_id: "${var.warehouse_id}"
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
              agent_mlflow_experiment_path: "${resources.experiments.agent_traces.name}"
          environment_key: sdk_latest

      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies: ["numpy", "pandas"]
        - environment_key: ml
          spec:
            client: "4"
            dependencies: ["xgboost", "scikit-learn", "mlflow>=3.1"]
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - "databricks-sdk>=0.114.0"
