# Cascadia SOC — Threat Hunting Copilot (Public Sector · Strengthen Security → Cybersecurity) — complete DAB.
#
# Recreates the whole demo on ANY workspace / catalog / schema (everything is a variable). Nothing is created by
# hand: the bundle owns the Lakebase database, the AI/BI dashboard, the agent-traces MLflow experiment, the
# Databricks App and the setup job; the setup job builds the data, the UEBA models and the Genie agent.
#
#   databricks bundle deploy  → Lakebase database + dashboard + experiment + app (resource) + setup job
#   databricks bundle run threat_hunting_setup
#       generate_data (schema + ir_playbook volume + 90 days of synthetic telemetry)
#       → train_ueba (Isolation Forest UEBA, registered in UC @champion; scores + lead queue)
#       → upload_ir_playbook (IR playbook → ir_playbook volume)
#       → deploy_genie (Genie agent over the tables + that volume; waits for the documents index) → grant_app_uc (UC + Genie for the app SP)
#       → export_resources (demo_resources table the app reads at boot + exit JSON)
#   databricks bundle run threat_hunting_app   → deploys the app source and starts it
#

bundle:
  name: pubsec_cyber_threat_hunting

variables:
  catalog:
    description: Unity Catalog for the demo data
    default: cybersecurity
  schema:
    description: Schema for the telemetry, UEBA tables, models and the IR-playbook volume
    default: threat_hunting_copilot
  warehouse_id:
    description: Serverless SQL warehouse (dashboard, Genie, app queries, investigation agent) — pass --var warehouse_id=<id>
  workspace_folder:
    description: Workspace folder holding the bundle, dashboard, Genie space and MLflow experiment
    default: /Workspace/Users/${workspace.current_user.userName}/pubsec-cyber-threat-hunting
  app_name:
    description: Databricks App name (unique per workspace, <= 30 chars)
    default: threat-hunting-copilot
  lakebase_project_slug:
    description: Existing Lakebase (autoscaling) project the app database lives in
  lakebase_branch_id:
    default: production
  lakebase_database_id:
    description: Lakebase database resource id (RFC1123, unique in the Lakebase project)
  lakebase_database:
    description: Postgres database name created by the bundle for the app
  lakebase_owner_role:
    description: >-
      Postgres role id (on the branch) that owns the database. Non-personal: a GROUP role for the
      workspace `admins` group, created once per Lakebase project (see dab_instructions.md).
  investigation_model:
    description: Chat-completions model for the per-lead investigation agent
    default: databricks-claude-sonnet-4-5

workspace:
  root_path: ${var.workspace_folder}/.bundle/${bundle.target}

artifacts:
  app:
    build: ./app/scripts/build-app.sh

sync:
  include:
    - "src/**"
    - "app/dist/**"
    - "app/client/dist/**"
    - "app/drizzle/**"
    - "app/package.json"        # the repo-root .gitignore ignores package*.json — the Apps
    - "app/package-lock.json"   # container needs both to npm install
  exclude:
    - "app/node_modules/**"
    - "app/.env"
    - "app/.env.*"
    - "app/.preview.pgid"
    - "app/playwright-report/**"
    - "app/test-results/**"
    - "app/tests/**"
    - "template_screenshot*.png"

targets:
  # Portable default (forks, Solution Builder "Download DAB"): NO pinned host — deploys to whatever workspace your
  # profile points at. Prereqs: the catalog, a Lakebase project with an owner role (pass --var lakebase_project_slug / lakebase_owner_role).
  #   databricks bundle deploy -p <profile> --var warehouse_id=<id> [--var catalog=… --var schema=… --var lakebase_project_slug=…]
  default:
    default: true

resources:
  experiments:
    agent_traces:
      # The app's agent traces (MLflow tracing). Bundle-owned so it lives in the demo folder and the app SP gets
      # CAN_EDIT through the app resource below (the SP can't create experiments in a folder it doesn't own).
      name: ${var.workspace_folder}/${var.app_name}-agent-traces

  postgres_databases:
    threat_hunting_db:
      parent: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
      database_id: ${var.lakebase_database_id}
      postgres_database: ${var.lakebase_database}
      role: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}/roles/${var.lakebase_owner_role}

  dashboards:
    soc_dashboard:
      display_name: "Cascadia SOC - Threat Hunting & Detection Performance"
      file_path: ./dashboard/soc_threat_hunting.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.workspace_folder}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      embed_credentials: true

  apps:
    threat_hunting_app:
      name: ${var.app_name}
      description: "Cascadia SOC Threat Hunting Copilot — UEBA lead queue, investigation agent (log pivots, ATT&CK mapping, IR playbook), incident-case write-back"
      source_code_path: ./app
      config:
        command: ["node", "--env-file-if-exists=.env", "dist/server.js"]
        env:
          - name: NODE_ENV
            value: production
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: WAREHOUSE_ID
            value_from: sql-warehouse
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: DEMO_CATALOG
            value: ${var.catalog}
          - name: DEMO_SCHEMA
            value: ${var.schema}
          - name: DASHBOARD_ID
            value: ${resources.dashboards.soc_dashboard.id}
          - name: INVESTIGATION_MODEL
            value: ${var.investigation_model}
          - name: AGENT_MLFLOW_EXPERIMENT_PATH
            value: ${resources.experiments.agent_traces.name}
          - name: LAKEBASE_PROJECT_ID
            value: ${var.lakebase_project_slug}
          # GENIE_SPACE_ID is NOT set here: the setup job creates the Genie agent and writes its id
          # to <catalog>.<schema>.demo_resources, which the app reads at boot.
      user_api_scopes:
        - serving.serving-endpoints
        - ai-gateway
        - dashboards.genie
        - sql
        - sql.statement-execution
        - postgres
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
            database: ${resources.postgres_databases.threat_hunting_db.name}
            permission: CAN_CONNECT_AND_CREATE
        - name: agent-traces
          experiment:
            experiment_id: ${resources.experiments.agent_traces.id}
            permission: CAN_EDIT

  jobs:
    threat_hunting_setup:
      name: "[PUBSEC] Threat Hunting Copilot - Setup"
      description: "Synthetic SOC telemetry → UEBA Isolation Forest (UC model) + lead queue → Genie agent (tables + IR playbook) → app grants"
      tasks:
        - task_key: generate_data
          spark_python_task:
            python_file: ./data_generation/generate_data.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

        - task_key: train_ueba
          depends_on: [{task_key: generate_data}]
          spark_python_task:
            python_file: ./src/ml/train_ueba.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--experiment", "${var.workspace_folder}/ueba_experiment"]
          environment_key: ml

        - task_key: upload_ir_playbook
          depends_on: [{task_key: generate_data}]
          notebook_task:
            notebook_path: ./src/deploy/upload_ir_playbook.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}
          environment_key: default

        - task_key: deploy_genie
          depends_on: [{task_key: train_ueba}, {task_key: upload_ir_playbook}]
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              warehouse_id: "${var.warehouse_id}"
              parent_path: "${var.workspace_folder}"
          environment_key: sdk_latest

        - task_key: grant_app_uc
          depends_on: [{task_key: train_ueba}, {task_key: deploy_genie}]
          notebook_task:
            notebook_path: ./src/deploy/grant_app_uc.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              app_name: "${var.app_name}"
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
          environment_key: sdk_latest

        - task_key: export_resources
          depends_on: [{task_key: deploy_genie}, {task_key: grant_app_uc}]
          notebook_task:
            notebook_path: ./src/deploy/export_resources.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              app_name: "${var.app_name}"
              dashboard_id: "${resources.dashboards.soc_dashboard.id}"
              warehouse_id: "${var.warehouse_id}"
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
              documents_volume: "{{tasks.deploy_genie.values.documents_volume}}"
              agent_mlflow_experiment_path: "${resources.experiments.agent_traces.name}"
          environment_key: sdk_latest

      environments:
        - environment_key: default
          spec:
            client: "4"
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - "scikit-learn>=1.5"
              - "mlflow[databricks]>=3.1"
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - "databricks-sdk>=0.114.0"
