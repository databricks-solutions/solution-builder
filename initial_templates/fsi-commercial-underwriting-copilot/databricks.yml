# Tidewell Specialty Insurance — Commercial Underwriting Copilot (FSI · Drive Growth → Underwriting & actuarial) — complete DAB.
#
# Recreates the whole demo on ANY workspace / catalog / schema (everything is a variable). Nothing is created by hand:
# the bundle owns the Lakebase database, the AI/BI dashboard, the agent-traces experiment, the Databricks App and the
# setup job; the setup job builds the data, the model, the Genie agent (tables + documents volume).
#
#   databricks bundle deploy  → Lakebase database + dashboard + experiment + app (resource) + setup job
#   databricks bundle run uw_copilot_setup
#       generate_data (schema + volumes + book of business + 24 broker packets as PDFs)
#         → extract_submissions (ai_parse_document + ai_query + ai_classify over every PDF)
#         → train_risk_model (UC model @champion; scores each submission as submitted vs verified)
#         → build_gold (portfolio loss ratios, broker performance, triaged queue) ─┐
#       upload_guidelines (guideline docs → uw_guidelines volume) ─────────────────┴→ deploy_genie (Genie agent over the
#         gold tables + the guidelines volume; waits for the documents index) → grant_app
#         → export_resources (demo_resources table the app reads at boot + exit JSON)
#   databricks bundle run uw_app   → deploys the app source and starts it
#
# See dab_instructions.md.

bundle:
  name: fsi_commercial_underwriting_copilot

variables:
  catalog:
    description: Unity Catalog for the demo data
    default: financial_services
  schema:
    description: Schema for demo tables, the ML model and the submission_docs / uw_guidelines volumes
    default: commercial_underwriting_copilot
  warehouse_id:
    description: Serverless SQL warehouse (dashboard, Genie, app analytics + write-back) — pass --var warehouse_id=<id>
  workspace_folder:
    description: Workspace folder holding the bundle, dashboard, Genie space and ML experiments
    default: /Workspace/Users/${workspace.current_user.userName}/fsi-commercial-underwriting-copilot
  app_name:
    description: Databricks App name (unique per workspace, <= 30 chars)
    default: underwriting-copilot
  lakebase_project_slug:
    description: Existing Lakebase (autoscaling) project the app database lives in
  lakebase_branch_id:
    default: production
  lakebase_database_id:
    description: Lakebase database resource id (RFC1123, unique in the project)
  lakebase_database:
    description: Postgres database name created by the bundle for the app
  lakebase_owner_role:
    description: >-
      Postgres role id (on the branch) that owns the database. Non-personal: a GROUP role for the
      workspace `admins` group, created once per Lakebase project (see dab_instructions.md).
  notice_model:
    description: Chat-completions model that writes the file rationale + broker letter in the underwriting review
    default: databricks-claude-sonnet-4-5

workspace:
  root_path: ${var.workspace_folder}/.bundle/${bundle.target}

artifacts:
  app:
    build: ./app/scripts/build-app.sh

sync:
  include:
    - "src/**"
    - "genie/**"
    - "app/dist/**"
    - "app/client/dist/**"
    - "app/drizzle/**"
    - "app/package.json"        # the repo-root .gitignore ignores package*.json — the Apps
    - "app/package-lock.json"   # container needs both to npm install
  exclude:
    - "app/node_modules/**"
    - "app/.env"
    - "app/.env.*"
    - "app/.preview.pgid"
    - "app/playwright-report/**"
    - "app/test-results/**"
    - "app/tests/**"
    - "template_screenshot*.png"

targets:
  # Portable default (forks, Solution Builder "Download DAB"): NO pinned host — deploys to whatever workspace your
  # profile points at. See dab_instructions.md ("Deploy to your own workspace").
  # The bundle creates the app's Lakebase database in an EXISTING Lakebase project (defaults: project `<project>`,
  # owner role `admins`; override with --var lakebase_project_slug / lakebase_owner_role).
  #   databricks bundle deploy -p <profile> --var warehouse_id=<id> [--var catalog=… --var schema=… --var lakebase_project_slug=… --var lakebase_owner_role=…]
  default:
    default: true

resources:
  experiments:
    agent_traces:
      # The app's agent traces (MLflow tracing). Bundle-owned so it lives in the demo folder and the app SP gets
      # CAN_EDIT through the app resource below (the SP can't create experiments in a folder it doesn't own).
      name: ${var.workspace_folder}/${var.app_name}-agent-traces

  postgres_databases:
    uw_db:
      parent: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
      database_id: ${var.lakebase_database_id}
      postgres_database: ${var.lakebase_database}
      role: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}/roles/${var.lakebase_owner_role}

  dashboards:
    uw_dashboard:
      display_name: "Tidewell - Commercial Property Portfolio & Underwriting"
      file_path: ./dashboard/commercial_underwriting_portfolio.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.workspace_folder}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      embed_credentials: true

  apps:
    uw_app:
      name: ${var.app_name}
      description: "Tidewell Underwriting Copilot — commercial P&C workbench: AI document intake, appetite checks with cited guidelines, risk model, pricing, CUO referrals and decision write-back"
      source_code_path: ./app
      config:
        command: ["node", "--env-file-if-exists=.env", "dist/server.js"]
        env:
          - name: NODE_ENV
            value: production
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: WAREHOUSE_ID
            value_from: sql-warehouse
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: DEMO_CATALOG
            value: ${var.catalog}
          - name: DEMO_SCHEMA
            value: ${var.schema}
          - name: DASHBOARD_ID
            value: ${resources.dashboards.uw_dashboard.id}
          - name: NOTICE_MODEL
            value: ${var.notice_model}
          - name: AGENT_MLFLOW_EXPERIMENT_PATH
            value: ${resources.experiments.agent_traces.name}
          - name: LAKEBASE_PROJECT_ID
            value: ${var.lakebase_project_slug}
          # GENIE_SPACE_ID is NOT set here: the setup job creates the Genie agent and writes its id
          # to <catalog>.<schema>.demo_resources, which the app reads at boot.
      user_api_scopes:
        - serving.serving-endpoints
        - ai-gateway
        - dashboards.genie
        - sql
        - sql.statement-execution
        - postgres
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
            database: ${resources.postgres_databases.uw_db.name}
            permission: CAN_CONNECT_AND_CREATE
        - name: agent-traces
          experiment:
            experiment_id: ${resources.experiments.agent_traces.id}
            permission: CAN_EDIT

  jobs:
    uw_copilot_setup:
      name: "[FSI] Commercial Underwriting Copilot - Setup"
      description: "Synthetic book + broker PDF packets → AI Functions document intake → UC risk model → gold + triage → Genie agent (tables + docs) → app grants"
      tasks:
        - task_key: generate_data
          spark_python_task:
            python_file: ./data_generation/generate_data.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: docs

        - task_key: extract_submissions
          depends_on: [{task_key: generate_data}]
          spark_python_task:
            python_file: ./src/ai/extract_submissions.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

        - task_key: train_risk_model
          depends_on: [{task_key: extract_submissions}]
          spark_python_task:
            python_file: ./src/ml/train_risk_model.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--experiment", "${var.workspace_folder}/experiments/submission-risk"]
          environment_key: ml

        - task_key: build_gold
          depends_on: [{task_key: train_risk_model}]
          spark_python_task:
            python_file: ./src/gold/build_gold.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

        - task_key: upload_guidelines
          depends_on: [{task_key: generate_data}]
          notebook_task:
            notebook_path: ./src/deploy/upload_guidelines.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}
          environment_key: default

        - task_key: deploy_genie
          depends_on: [{task_key: build_gold}, {task_key: upload_guidelines}]
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              warehouse_id: "${var.warehouse_id}"
              parent_path: "${var.workspace_folder}"
          environment_key: sdk_latest

        - task_key: grant_app
          depends_on: [{task_key: deploy_genie}]
          notebook_task:
            notebook_path: ./src/deploy/grant_app_uc.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              app_name: "${var.app_name}"
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
          environment_key: sdk_latest

        - task_key: export_resources
          depends_on: [{task_key: grant_app}]
          notebook_task:
            notebook_path: ./src/deploy/export_resources.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              app_name: "${var.app_name}"
              dashboard_id: "${resources.dashboards.uw_dashboard.id}"
              warehouse_id: "${var.warehouse_id}"
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
              documents_volume: "{{tasks.deploy_genie.values.documents_volume}}"
              agent_mlflow_experiment_path: "${resources.experiments.agent_traces.name}"
          environment_key: sdk_latest

      environments:
        - environment_key: default
          spec:
            client: "4"
        - environment_key: docs
          spec:
            client: "4"
            dependencies:
              - "reportlab>=4.0"
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - "mlflow>=3.1"
              - "scikit-learn>=1.5"
              - "pandas"
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - "databricks-sdk>=0.114.0"
