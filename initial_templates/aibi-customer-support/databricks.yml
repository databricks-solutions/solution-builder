# Databricks Asset Bundle — AI/BI Customer Support (no app, no Lakebase).
#
# Re-creates the whole demo from scratch on any workspace:
#   1. `databricks bundle deploy` — creates the schema + dashboard (published) + setup job.
#   2. `databricks bundle run customer_support_setup` — generates data + builds the
#      medallion (generate_data.py) and deploys the Genie space.
# The dashboard is a DAB `dashboards` resource; its schema-less datasets are rebound to the
# target catalog/schema via dataset_catalog / dataset_schema (needs CLI >= 0.283.0).
#
# Deploy is documented in dab_instructions.md — do NOT run it as part of authoring.
bundle:
  name: aibi-customer-support

variables:
  catalog:
    description: Unity Catalog for the demo.
    default: dbdemos_templates
  schema:
    description: Schema for the demo tables, dashboard, and Genie space.
    default: aibi_customer_support
  warehouse_id:
    description: SQL warehouse the dashboard + Genie space use.
  workspace_folder:
    description: Workspace folder that holds the bundle files, dashboard and Genie space (by default the bundle root).
    default: ${workspace.root_path}

resources:
  schemas:
    demo_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "AI/BI Customer Support demo — synthetic data, dashboard, Genie."

  dashboards:
    customer_support_dashboard:
      display_name: "AI-BI - Customer Support: AI Efficiency"   # no "/": a dashboard in a folder is a workspace item
      file_path: ./dashboard/dashboard.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.workspace_folder}
      embed_credentials: true
      # Rebind the dashboard's (schema-less) datasets to the deployed catalog/schema. The metric view is
      # read through a SQL dataset (SELECT … MEASURE(…) FROM support_metrics GROUP BY ALL), NOT an
      # `asset_name` dataset: asset_name must be fully qualified and is NOT rewritten by dataset_catalog.
      dataset_catalog: ${var.catalog}
      dataset_schema: ${resources.schemas.demo_schema.name}

  jobs:
    customer_support_setup:
      name: "[AI/BI] AI/BI Customer Support — setup"
      tasks:
        - task_key: generate_data_and_build
          spark_python_task:
            python_file: ./data_generation/generate_data.py
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--schema"
              - ${resources.schemas.demo_schema.name}
          environment_key: sdk_default
        - task_key: deploy_genie
          depends_on:
            - task_key: generate_data_and_build
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.demo_schema.name}
              warehouse_id: ${var.warehouse_id}
              parent_path: ${var.workspace_folder}
          environment_key: sdk_latest
      environments:
        - environment_key: sdk_default
          spec:
            client: "4"
            dependencies:
              - numpy
              - pandas
              - holidays
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - databricks-sdk>=0.114.0

targets:
  # Portable targets (NO pinned host): used by Solution Builder forks / "Download DAB" on any workspace —
  dev:
    mode: development
    default: true
  prod:
    mode: production
