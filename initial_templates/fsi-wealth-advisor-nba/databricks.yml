# Calder Pine Private Wealth — Advisor Morning Book (next-best action with suitability guardrails) — complete DAB.
#
# Recreates the whole demo on ANY workspace / catalog / schema (everything is a variable):
#   AI/BI dashboard + Databricks App (resource shells, `bundle deploy`)
#   + a setup job that, on `bundle run wealth_advisor_setup`, fills them in:
#       generate_data (schema, tables, gold, policy_docs volume) → note_insights (AI Functions on a warehouse)
#       → train_nba_model (XGBoost → UC model @champion → scores + suitability rules → Morning Book tables)
#       upload_policy_docs (policy docs → policy_docs volume)
#       → deploy_genie (Genie agent over the tables + that volume; waits for the documents index) → grant_app_uc → export_resources (exit JSON with every resolved ID)
#
# Nothing is created by hand: the bundle owns the Lakebase database, the dashboard, the app, the MLflow
# agent-traces experiment and the setup job; the setup job builds data, model and the Genie agent from an EMPTY schema
# and writes their IDs to <catalog>.<schema>.demo_resources, which the app reads at boot.
#
# ── Deploy (see dab_instructions.md) ─────────────────────────────────────────
#   databricks bundle deploy
#   databricks bundle run wealth_advisor_setup
#   databricks bundle run wealth_advisor_app

bundle:
  name: fsi_wealth_advisor_nba

variables:
  catalog:
    description: Unity Catalog for the demo data
    default: financial_services
  schema:
    description: Schema for demo tables, the UC model and the policy_docs volume
    default: wealth_advisor_copilot
  warehouse_id:
    description: Serverless SQL warehouse (dashboard, Genie, AI Functions, app analytics) — pass --var warehouse_id=<id>
  workspace_folder:
    description: Workspace folder holding the bundle, dashboard, Genie space and MLflow experiment
    default: /Workspace/Users/${workspace.current_user.userName}/fsi-wealth-advisor-nba
  app_name:
    description: Databricks App name (unique per workspace, <= 30 chars)
    default: wealth-advisor-copilot
  lakebase_project_slug:
    description: Existing Lakebase (autoscaling) project the app database lives in
  lakebase_branch_id:
    default: production
  lakebase_database:
    description: Postgres database name created by the bundle for the app
  lakebase_database_id:
    description: Lakebase database resource id (RFC1123, unique in the project)
  lakebase_owner_role:
    description: >-
      Postgres role id (on the branch) that owns the database. Non-personal: a GROUP role for the
      workspace `admins` group, created once per Lakebase project.
  draft_model:
    description: Chat-completions model for the meeting brief + outreach draft
    default: databricks-claude-sonnet-4-5
  advisor_id:
    description: Advisor whose book the app is demoed as (ADV-007 = Elena Marsh)
    default: ADV-007

workspace:
  root_path: ${var.workspace_folder}/.bundle/${bundle.target}

artifacts:
  app:
    build: ./app/scripts/build-app.sh

sync:
  include:
    - "src/**"
    - "genie/**"
    - "app/dist/**"
    - "app/client/dist/**"
    - "app/drizzle/**"
    - "app/package.json"        # the repo-root .gitignore ignores package*.json — the Apps
    - "app/package-lock.json"   # container needs both to npm install
  exclude:
    - "app/node_modules/**"
    - "app/.env"
    - "app/.env.*"
    - "app/.preview.pgid"
    - "app/playwright-report/**"
    - "app/test-results/**"
    - "app/tests/**"
    - "template_screenshot*.png"

targets:
  # Portable default (forks, Solution Builder "Download DAB"): NO pinned host — deploys to whatever workspace your
  # profile points at. See dab_instructions.md ("Deploy to your own workspace").
  # The bundle creates the app's Lakebase database in an EXISTING Lakebase project (defaults: project `<project>`,
  # owner role `admins`; override with --var lakebase_project_slug / lakebase_owner_role).
  #   databricks bundle deploy -p <profile> --var warehouse_id=<id> [--var catalog=… --var schema=… --var lakebase_project_slug=… --var lakebase_owner_role=…]
  default:
    default: true

resources:
  experiments:
    agent_traces:
      # The app's agent traces (MLflow tracing). Bundle-owned so it lives in the demo folder and the app SP gets
      # CAN_EDIT through the app resource below (the SP can't create experiments in a folder it doesn't own).
      name: ${var.workspace_folder}/${var.app_name}-agent-traces

  postgres_databases:
    wealth_advisor_db:
      parent: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
      database_id: ${var.lakebase_database_id}
      postgres_database: ${var.lakebase_database}
      role: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}/roles/${var.lakebase_owner_role}

  dashboards:
    wealth_desk_dashboard:
      display_name: "Calder Pine - Wealth Desk: Money in Motion & Next Best Action"
      file_path: ./dashboard/wealth_desk.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.workspace_folder}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      embed_credentials: true

  apps:
    wealth_advisor_app:
      name: ${var.app_name}
      description: "Calder Pine Advisor Morning Book — next-best actions ranked by ML, checked for suitability, meeting prep + outreach, decisions written back"
      source_code_path: ./app
      config:
        command: ["node", "--env-file-if-exists=.env", "dist/server.js"]
        env:
          - name: NODE_ENV
            value: production
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: WAREHOUSE_ID
            value_from: sql-warehouse
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: DEMO_CATALOG
            value: ${var.catalog}
          - name: DEMO_SCHEMA
            value: ${var.schema}
          - name: ADVISOR_ID
            value: ${var.advisor_id}
          - name: DASHBOARD_ID
            value: ${resources.dashboards.wealth_desk_dashboard.id}
          - name: DRAFT_MODEL
            value: ${var.draft_model}
          - name: AGENT_MLFLOW_EXPERIMENT_PATH
            value: ${resources.experiments.agent_traces.name}
          - name: LAKEBASE_PROJECT_ID
            value: ${var.lakebase_project_slug}
          # GENIE_SPACE_ID is NOT set here: the setup job creates the Genie agent and writes its id
          # to <catalog>.<schema>.demo_resources, which the app reads at boot (server/services/resources.ts).
      user_api_scopes:
        - serving.serving-endpoints
        - ai-gateway
        - dashboards.genie
        - sql
        - sql.statement-execution
        - postgres
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
            database: ${resources.postgres_databases.wealth_advisor_db.name}
            permission: CAN_CONNECT_AND_CREATE
        - name: agent-traces
          experiment:
            experiment_id: ${resources.experiments.agent_traces.id}
            permission: CAN_EDIT

  jobs:
    wealth_advisor_setup:
      name: "[FSI] Wealth Advisor Morning Book - Setup"
      description: "Synthetic data → AI Functions over CRM notes → NBA propensity model (UC) + suitability → Genie agent (tables + docs) → app grants"
      tasks:
        - task_key: generate_data
          spark_python_task:
            python_file: ./data_generation/generate_data.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

        - task_key: note_insights
          depends_on: [{task_key: generate_data}]
          spark_python_task:
            python_file: ./src/deploy/run_sql_on_warehouse.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--warehouse_id", "${var.warehouse_id}", "--sql_file", "${workspace.file_path}/src/ai/note_insights.sql"]
          environment_key: sdk_latest

        - task_key: train_nba_model
          depends_on: [{task_key: note_insights}]
          spark_python_task:
            python_file: ./src/ml/train_nba_model.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--experiment", "${var.workspace_folder}/nba_propensity_experiment"]
          environment_key: ml

        - task_key: upload_policy_docs
          depends_on: [{task_key: generate_data}]
          notebook_task:
            notebook_path: ./src/deploy/upload_policy_docs.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}
          environment_key: default

        - task_key: deploy_genie
          depends_on: [{task_key: train_nba_model}, {task_key: upload_policy_docs}]
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              warehouse_id: "${var.warehouse_id}"
              parent_path: "${var.workspace_folder}"
          environment_key: sdk_latest

        - task_key: grant_app_uc
          depends_on: [{task_key: deploy_genie}]
          notebook_task:
            notebook_path: ./src/deploy/grant_app_uc.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              app_name: "${var.app_name}"
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
          environment_key: sdk_latest

        - task_key: export_resources
          depends_on: [{task_key: grant_app_uc}]
          notebook_task:
            notebook_path: ./src/deploy/export_resources.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              app_name: "${var.app_name}"
              dashboard_id: "${resources.dashboards.wealth_desk_dashboard.id}"
              warehouse_id: "${var.warehouse_id}"
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
              documents_volume: "{{tasks.deploy_genie.values.documents_volume}}"
              agent_mlflow_experiment_path: "${resources.experiments.agent_traces.name}"
          environment_key: sdk_latest

      environments:
        - environment_key: default
          spec:
            client: "4"
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - "databricks-sdk>=0.114.0"
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - "xgboost==3.4.1"
              - "mlflow[databricks]>=3.4"
              - "scikit-learn"
