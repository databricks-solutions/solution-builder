# Halcyon Wireless — NOC Copilot (Telecom · Optimize & Automate Network Operations → Network monitoring,
# anomaly detection & triage) — complete DAB.
#
# Recreates the whole demo on ANY workspace / catalog / schema (everything is a variable):
#   schema + SDP pipeline + AI/BI dashboard + Databricks App (resource shells, `bundle deploy`)
#   + a setup job that, on `bundle run noc_copilot_setup`, fills them in:
#       generate_data (reference tables + raw KPI / alarm / optics telemetry landed in a volume)
#       → run_pipeline (Lakeflow SDP: bronze → silver → gold, full refresh)
#       → train_anomaly (Isolation Forest KPI anomaly model, UC @champion → cell_health_daily)
#       → build_incident_queue (topology alarm correlation + anomalies → noc_incidents; ai_classify on ticket notes)
#       → upload_runbooks (NOC runbooks → noc_runbooks volume)
#       → deploy_genie (Genie agent over the tables + that volume; waits for the documents index) → grant_app_uc → export_resources (exit JSON with every resolved ID)
#
#   databricks bundle deploy
#       → builds the app (artifacts), schema, SDP pipeline, Lakebase database (shared <project> project),
#         agent-traces experiment, dashboard, app (compute stopped) and the setup job
#   databricks bundle run noc_copilot_setup
#       … → export_resources writes <catalog>.<schema>.demo_resources (Genie agent id, documents volume, …) — the app reads
#         it at boot, so no id is ever copied by hand into the app config
#   databricks bundle run noc_app      # deploys the app source + starts it
#
# Target `portable` (default, no pinned host) = deploy anywhere, see its comment below.
# app/scripts/lakebase_setup_db.sh; its Genie id is pinned in the target because it predates demo_resources).

bundle:
  name: telco_network_ops_copilot

variables:
  catalog:
    description: Unity Catalog for the demo data (must exist; the bundle creates the schema)
    default: telecommunications
  schema:
    description: Schema for the telemetry, pipeline tables, model, incident queue and volumes
    default: network_ops_copilot
  warehouse_id:
    description: Serverless SQL warehouse (dashboard, Genie, app queries, triage agent)
  workspace_folder:
    description: Workspace folder holding the bundle, dashboard, Genie space and MLflow experiment
    default: /Workspace/Users/${workspace.current_user.userName}/telco-network-ops-copilot
  app_name:
    description: Databricks App name (unique per workspace, <= 30 chars)
    default: noc-copilot
  lakebase_project_slug:
    description: Lakebase project slug (projects/<slug>/…), created/reused by lakebase_setup_db.sh
    default: solution-builder
  lakebase_branch_id:
    default: production
  lakebase_database_id:
    description: Lakebase database resource id (db- + database name, underscores → hyphens)
    default: db-dbgen-noc-copilot
  lakebase_database:
    description: Postgres database name (the bundle creates it in the project)
    default: dbgen_noc_copilot
  lakebase_owner_role:
    description: >-
      Postgres role id (on the branch) that owns the bundle-created database. Non-personal: a group role, not a personal one.
  agent_mlflow_experiment_path:
    description: MLflow experiment the app records agent traces in
    default: ${var.workspace_folder}/${var.app_name}-agent-traces

workspace:
  root_path: ${var.workspace_folder}/.bundle/${bundle.target}

artifacts:
  app:
    build: ./app/scripts/build-app.sh

sync:
  include:
    - "src/**"
    - "app/dist/**"
    - "app/client/dist/**"
    - "app/drizzle/**"
    - "app/package.json"        # the repo-root .gitignore ignores package*.json — the Apps
    - "app/package-lock.json"   # container needs both to npm install
  exclude:
    - "app/node_modules/**"
    - "app/.env"
    - "app/.env.*"
    - "app/.preview.pgid"
    - "app/playwright-report/**"
    - "app/test-results/**"
    - "app/tests/**"
    - "template_screenshot*.png"

targets:
  # Portable default (forks / "Download DAB"): NO pinned host — deploys to whatever workspace your profile points at.
  # Bundle files, dashboard, Genie space and experiments go under your user folder; the Lakebase database is
  # bundle-owned in an EXISTING Lakebase project. Pass the workspace-specific values:
  #   databricks bundle deploy -p <profile> --var catalog=<existing catalog> --var schema=<new schema> \
  #     --var lakebase_project_slug=<existing lakebase project> --var lakebase_owner_role=<postgres role id on its branch>
  #   [--var warehouse_id=<id>]   (default: the workspace's "Serverless Starter Warehouse")
  #   databricks bundle run noc_copilot_setup -p <profile> … ; databricks bundle run noc_app -p <profile> …
  portable:
    default: true
    variables:
      workspace_folder: /Workspace/Users/${workspace.current_user.userName}/telco-network-ops-copilot
      warehouse_id:
        lookup:
          warehouse: Serverless Starter Warehouse
      lakebase_database_id: db-${var.app_name}
      lakebase_database: noc_copilot
    resources:
      experiments:
        agent_traces:
          name: ${var.agent_mlflow_experiment_path}
      postgres_databases:
        noc_db:
          parent: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
          database_id: ${var.lakebase_database_id}
          postgres_database: ${var.lakebase_database}
          role: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}/roles/${var.lakebase_owner_role}
      apps:
        noc_app:
          resources:
            - name: postgres
              postgres:
                branch: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
                database: ${resources.postgres_databases.noc_db.name}
                permission: CAN_CONNECT_AND_CREATE
            - name: agent-traces
              experiment:
                experiment_id: ${resources.experiments.agent_traces.id}
                permission: CAN_EDIT

resources:
  schemas:
    demo_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "Halcyon Wireless NOC copilot demo — synthetic RAN / transport telemetry, SDP pipeline tables, KPI anomaly model, incident queue"

  pipelines:
    network_telemetry:
      name: "[TELCO] NOC Copilot - Network Telemetry (SDP)"
      catalog: ${resources.schemas.demo_schema.catalog_name}
      schema: ${resources.schemas.demo_schema.name}
      serverless: true
      photon: true
      channel: current
      # read_files('/Volumes/${catalog}/${schema}/raw_telemetry/...') and the topology joins resolve against
      # these values at parse time — the pipeline works on whatever catalog/schema this deploy targets.
      configuration:
        catalog: ${resources.schemas.demo_schema.catalog_name}
        schema: ${resources.schemas.demo_schema.name}
      libraries:
        - file:
            path: ./src/pipeline/01_bronze.sql
        - file:
            path: ./src/pipeline/02_silver.sql
        - file:
            path: ./src/pipeline/03_gold.sql

  dashboards:
    noc_dashboard:
      display_name: "Halcyon NOC - Network Operations"
      file_path: ./dashboard/noc_network_ops.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.workspace_folder}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      embed_credentials: true

  apps:
    noc_app:
      name: ${var.app_name}
      description: "Halcyon NOC Copilot — correlated incident queue, triage agent (topology, alarms, optics, KPIs, runbooks), trouble-ticket + dispatch write-back"
      source_code_path: ./app
      # App runtime config lives here (no app/app.yaml): catalog/schema/dashboard/pipeline come from the bundle;
      # GENIE_SPACE_ID is NOT set (except on `demo`, see targets) — the setup job's
      # export_resources task writes it to <catalog>.<schema>.demo_resources, which the app reads at boot.
      config:
        command: ["node", "--env-file-if-exists=.env", "dist/server.js"]
        env:
          - name: NODE_ENV
            value: production
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: WAREHOUSE_ID
            value_from: sql-warehouse
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: DEMO_CATALOG
            value: ${var.catalog}
          - name: DEMO_SCHEMA
            value: ${var.schema}
          - name: DASHBOARD_ID
            value: ${resources.dashboards.noc_dashboard.id}
          - name: PIPELINE_ID
            value: ${resources.pipelines.network_telemetry.id}
          - name: AGENT_MLFLOW_EXPERIMENT_PATH
            value: ${var.agent_mlflow_experiment_path}
          - name: LAKEBASE_PROJECT_ID
            value: ${var.lakebase_project_slug}
      user_api_scopes:
        - serving.serving-endpoints
        - ai-gateway
        - dashboards.genie
        - sql
        - sql.statement-execution
        - postgres
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
            database: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}/databases/${var.lakebase_database_id}
            permission: CAN_CONNECT_AND_CREATE

  jobs:
    noc_copilot_setup:
      name: "[TELCO] NOC Copilot - Setup"
      description: "Synthetic network telemetry → SDP pipeline → KPI anomaly model (UC) → alarm correlation / incident queue → Genie agent (tables + NOC runbooks) → app grants"
      tasks:
        - task_key: generate_data
          spark_python_task:
            python_file: ./data_generation/generate_data.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${resources.schemas.demo_schema.name}"]
          environment_key: default

        - task_key: run_pipeline
          depends_on: [{task_key: generate_data}]
          pipeline_task:
            pipeline_id: ${resources.pipelines.network_telemetry.id}
            full_refresh: true

        - task_key: train_anomaly
          depends_on: [{task_key: run_pipeline}]
          spark_python_task:
            python_file: ./src/ml/train_anomaly.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}", "--experiment", "${var.workspace_folder}/kpi_anomaly_experiment"]
          environment_key: ml

        - task_key: build_incident_queue
          depends_on: [{task_key: train_anomaly}]
          spark_python_task:
            python_file: ./src/correlation/build_incident_queue.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: default

        - task_key: upload_runbooks
          depends_on: [{task_key: generate_data}]
          notebook_task:
            notebook_path: ./src/deploy/upload_runbooks.py
            base_parameters: {catalog: "${var.catalog}", schema: "${var.schema}"}
          environment_key: default

        - task_key: deploy_genie
          depends_on: [{task_key: build_incident_queue}, {task_key: upload_runbooks}]
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              warehouse_id: "${var.warehouse_id}"
              parent_path: "${var.workspace_folder}"
          environment_key: sdk_latest

        - task_key: grant_app_uc
          depends_on: [{task_key: build_incident_queue}, {task_key: deploy_genie}]
          notebook_task:
            notebook_path: ./src/deploy/grant_app_uc.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              app_name: "${var.app_name}"
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
          environment_key: sdk_latest

        - task_key: export_resources
          depends_on: [{task_key: deploy_genie}, {task_key: grant_app_uc}]
          notebook_task:
            notebook_path: ./src/deploy/export_resources.py
            base_parameters:
              catalog: "${var.catalog}"
              schema: "${var.schema}"
              app_name: "${var.app_name}"
              dashboard_id: "${resources.dashboards.noc_dashboard.id}"
              warehouse_id: "${var.warehouse_id}"
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
              documents_volume: "{{tasks.deploy_genie.values.documents_volume}}"
              pipeline_id: "${resources.pipelines.network_telemetry.id}"
              agent_mlflow_experiment_path: "${var.agent_mlflow_experiment_path}"
          environment_key: sdk_latest

      environments:
        - environment_key: default
          spec:
            client: "4"
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - "scikit-learn>=1.5"
              - "mlflow[databricks]>=3.1"
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - "databricks-sdk>=0.114.0"
