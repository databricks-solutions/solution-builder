# LuxeBeauty Returns demo — complete DAB.
#
# Recreates the whole flagship demo on ANY workspace / catalog / schema from an EMPTY schema (everything is a
# variable, nothing is created by hand, no ID is copied by hand):
#
#   databricks bundle deploy   → schema + volumes + SDP pipeline + AI/BI dashboard + Lakebase database
#                                + agent-traces MLflow experiment + the Databricks App (resource) + setup job
#   databricks bundle run luxebeauty_setup
#       generate_data (raw parquet → raw_data volume; story time PINNED → bad lot LOT-2026-0531, same as the incident PDF)
#       → run_pipeline (SDP silver + gold) → deploy_metric_view (mv_returns) + train_score_ml (UC model @prod)
#       upload_pdfs → deploy_genie (Genie Agent over tables + the PDF volume; waits for the index)
#       → grant_app_uc (UC + Genie CAN_RUN for the app SP)
#       → export_resources (<catalog>.<schema>.demo_resources — the app reads the Genie id from it at boot)
#   databricks bundle run luxebeauty_demo   → deploys the app source and starts it
#
# The Genie Agent is looked up by NAME (job params below), so re-running the job updates it in place.
# See dab_instructions.md.

bundle:
  name: luxebeauty_demo

variables:
  catalog:
    description: "Unity Catalog for demo resources"
    default: retail_consumer_goods
  schema:
    description: "Schema within the catalog (created by this bundle)"
    default: luxebeauty_demo
  warehouse_id:
    description: "SQL Warehouse ID — powers the dashboard, Genie and the app analytics (required: --var warehouse_id=…)"
  workspace_folder:
    description: "Workspace folder holding the dashboard, Genie space and MLflow experiments (created by the bundle)"
    default: /Workspace/Users/${workspace.current_user.userName}/luxebeauty_returns

  # ── Genie name (looked up by name → idempotent; must be unique in the workspace) ──
  genie_title:
    description: "Genie space title (no '/')"
    default: "LuxeBeauty Operations Analytics"

  # ── App + Lakebase ────────────────────────────────────────────────────
  app_name:
    description: "Workspace app name (must be unique per workspace)"
    default: "luxebeauty-demo"
  lakebase_project_slug:
    description: "Existing Lakebase (autoscaling) project the app database lives in"
    default: "dbdemos-asset-generator"
  lakebase_branch_id:
    description: "Lakebase branch within the project"
    default: "production"
  lakebase_database_name:
    description: "Postgres database name created by the bundle for the app"
    default: "dbgen_luxebeauty"
  lakebase_database_id:
    description: "Lakebase database resource id (RFC1123)"
    default: "db-dbgen-luxebeauty"
  lakebase_owner_role:
    description: >-
      Postgres role id (on the branch) that owns the database — a role that exists on your branch (your own user's
      role id, or a group role). A GROUP role works best.

# Build the app before sync — produces app/dist/server.js + app/client/dist/ + app/drizzle/ (all gitignored;
# whitelisted by sync.include so the Apps container gets them).
artifacts:
  app:
    build: ./app/scripts/build-app.sh

sync:
  include:
    - "src/**"
    - "app/dist/**"          # tsdown output (server bundle)
    - "app/client/dist/**"   # vite output (client bundle)
    - "app/drizzle/**"       # Drizzle SQL migrations (pinned baseline, see app/scripts/db-generate.js)
    - "app/shared/**"
    - "app/package.json"        # the repo-root .gitignore ignores package*.json — the Apps
    - "app/package-lock.json"   # container needs both to npm install
  # node_modules is ~900 MB — never ship it (the Apps container runs its own `npm install`).
  exclude:
    - "app/node_modules/**"
    - "app/.venv/**"
    - "app/.env"
    - "app/.env.*"
    - "app/.preview.pgid"
    - "app/.DS_Store"
    - "app/playwright-report/**"
    - "app/test-results/**"
    - "app/tests/**"
    - "template_screenshot*.png"

targets:
  # Portable default target (forks / "Download DAB"): NO pinned host — deploys to whatever workspace the CLI profile
  # points at. Pass at least --var warehouse_id=… (and catalog/schema/lakebase_* to taste).
  dev:
    default: true
    mode: development

  prod:
    mode: production

resources:
  # ──────────────────────────────────────────────────────────────────────────
  # Schema + volumes (volumes reference the schema RESOURCE so they're created after it)
  # ──────────────────────────────────────────────────────────────────────────
  schemas:
    demo_schema:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: "LuxeBeauty Returns demo data"

  volumes:
    raw_data:
      catalog_name: ${resources.schemas.demo_schema.catalog_name}
      schema_name: ${resources.schemas.demo_schema.name}
      name: "raw_data"
      volume_type: "MANAGED"
      comment: "Raw parquet landing zone — the SDP silver reads these files via read_files()"

    manufacturing_reports:
      catalog_name: ${resources.schemas.demo_schema.catalog_name}
      schema_name: ${resources.schemas.demo_schema.name}
      name: "manufacturing_reports"
      volume_type: "MANAGED"
      comment: "Document PDFs attached to the Genie Agent (PDFs only)"

  # ──────────────────────────────────────────────────────────────────────────
  # Lakebase database for the app (in an existing project/branch)
  # ──────────────────────────────────────────────────────────────────────────
  postgres_databases:
    luxebeauty_db:
      parent: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
      database_id: ${var.lakebase_database_id}
      postgres_database: ${var.lakebase_database_name}
      role: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}/roles/${var.lakebase_owner_role}

  # The app's agent traces. Bundle-owned so it lives in the demo folder and the app SP gets CAN_EDIT through the
  # app resource below (the SP can't create experiments in a folder it doesn't own).
  experiments:
    agent_traces:
      name: ${var.workspace_folder}/${var.app_name}-agent-traces

  # ──────────────────────────────────────────────────────────────────────────
  # SDP pipeline — silver + gold
  # ──────────────────────────────────────────────────────────────────────────
  pipelines:
    luxebeauty_pipeline:
      name: "[${bundle.target}] LuxeBeauty Returns Pipeline"
      catalog: ${resources.schemas.demo_schema.catalog_name}
      target: ${resources.schemas.demo_schema.name}
      serverless: true
      photon: true
      development: true
      channel: current
      # The silver/gold SQL reads raw parquet via read_files('/Volumes/${catalog}/${schema}/raw_data/...'); SDP
      # substitutes these values at parse time, so the pipeline reads from whatever catalog/schema this deploy targets.
      configuration:
        catalog: ${resources.schemas.demo_schema.catalog_name}
        schema: ${resources.schemas.demo_schema.name}
      libraries:
        - file:
            path: ./src/pipeline/01_bronze.sql
        - file:
            path: ./src/pipeline/02_silver.sql
        - file:
            path: ./src/pipeline/03_gold.sql

  # ──────────────────────────────────────────────────────────────────────────
  # Dashboard — dataset_catalog / dataset_schema rebind the schema-less queries per target
  # ──────────────────────────────────────────────────────────────────────────
  dashboards:
    luxebeauty_dashboard:
      display_name: "[${bundle.target}] LuxeBeauty Returns"
      file_path: ./src/dashboard/dashboard.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.workspace_folder}
      # Owner's credentials so the dashboard embedded in the app renders for every viewer.
      embed_credentials: true
      dataset_catalog: ${resources.schemas.demo_schema.catalog_name}
      dataset_schema: ${resources.schemas.demo_schema.name}

  # ──────────────────────────────────────────────────────────────────────────
  # Databricks App — Returns Console UI
  # ──────────────────────────────────────────────────────────────────────────
  apps:
    luxebeauty_demo:
      name: ${var.app_name}
      description: "LuxeBeauty Returns Console — agent-driven returns triage"
      source_code_path: ./app
      lifecycle:
        prevent_destroy: true
      config:
        command: ["node", "--env-file-if-exists=.env", "dist/server.js"]
        env:
          - name: NODE_ENV
            value: production
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: WAREHOUSE_ID
            value_from: sql-warehouse
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: DEMO_CATALOG
            value: ${var.catalog}
          - name: DEMO_SCHEMA
            value: ${var.schema}
          - name: DASHBOARD_ID
            value: ${resources.dashboards.luxebeauty_dashboard.id}
          - name: PIPELINE_ID
            value: ${resources.pipelines.luxebeauty_pipeline.id}
          - name: AGENT_MLFLOW_EXPERIMENT_PATH
            value: ${resources.experiments.agent_traces.name}
          # GENIE_SPACE_ID / APP_URL / LAKEBASE_PROJECT_ID are NOT set here:
          # the setup job creates/resolves them and writes them to <catalog>.<schema>.demo_resources, which the app
          # reads at boot (app/server/lib/demo-resources.ts). An env value set here would win.
      # OBO scopes. Without serving + ai-gateway the agent loop's /serving-endpoints/responses call 403s.
      user_api_scopes:
        - serving.serving-endpoints
        - ai-gateway
        - dashboards.genie
        - sql
        - sql.statement-execution
        - postgres
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
            database: ${resources.postgres_databases.luxebeauty_db.name}
            permission: CAN_CONNECT_AND_CREATE
        - name: agent-traces
          experiment:
            experiment_id: ${resources.experiments.agent_traces.id}
            permission: CAN_EDIT

  # ──────────────────────────────────────────────────────────────────────────
  # Setup job — builds everything that isn't a bundle resource, from an empty schema
  # ──────────────────────────────────────────────────────────────────────────
  jobs:
    luxebeauty_setup:
      name: "[${bundle.target}] LuxeBeauty Returns - Setup"
      description: "Generate data → SDP pipeline → metric view + premium classifier → PDFs → Genie Agent (tables + documents) → app grants → demo_resources"
      max_concurrent_runs: 1

      tasks:
        # Raw parquet datasets → raw_data volume. pin_time=1 freezes the story clock (NOW = 2026-07-13) so the bad lot is
        # ALWAYS LOT-2026-0531 — the id the hand-authored incident PDF, Genie instructions and dashboard text cite.
        - task_key: generate_data
          notebook_task:
            notebook_path: ./src/data_generation/generate_data.py
            base_parameters:
              catalog: ${resources.schemas.demo_schema.catalog_name}
              schema:  ${resources.schemas.demo_schema.name}
              pin_time: "1"
          environment_key: sdk_default

        - task_key: run_pipeline
          depends_on:
            - task_key: generate_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.luxebeauty_pipeline.id}
            full_refresh: true

        - task_key: deploy_metric_view
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ./src/metric_view/mv_returns.py
            base_parameters:
              catalog: ${resources.schemas.demo_schema.catalog_name}
              schema:  ${resources.schemas.demo_schema.name}
          environment_key: sdk_default

        - task_key: train_score_ml
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ./src/ml/premium_train_score.py
            base_parameters:
              catalog: ${resources.schemas.demo_schema.catalog_name}
              schema:  ${resources.schemas.demo_schema.name}
              experiment_path: ${var.workspace_folder}/premium_classifier_experiment
          environment_key: ml

        # Pre-rendered document PDFs (src/documents/pdf, synced by the bundle) → manufacturing_reports volume.
        - task_key: upload_pdfs
          notebook_task:
            notebook_path: ./src/deploy/upload_pdfs.py
            base_parameters:
              catalog: ${resources.schemas.demo_schema.catalog_name}
              schema:  ${resources.schemas.demo_schema.name}
              files_root: ${workspace.file_path}
          environment_key: sdk_default

        # Genie validates every table on create → wait for the metric view AND the ML predictions table.
        # It also attaches the PDF volume → wait for upload_pdfs (the index needs the PDFs).
        - task_key: deploy_genie
          depends_on:
            - task_key: upload_pdfs
            - task_key: deploy_metric_view
            - task_key: train_score_ml
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog:      ${resources.schemas.demo_schema.catalog_name}
              schema:       ${resources.schemas.demo_schema.name}
              warehouse_id: ${var.warehouse_id}
              title:        ${var.genie_title}
              parent_path:  ${var.workspace_folder}
              files_root:   ${workspace.file_path}
          environment_key: sdk_latest

        # App SP: UC read on the schema + volumes, EXECUTE on the model, CAN_RUN on the Genie Agent.
        - task_key: grant_app_uc
          depends_on:
            - task_key: deploy_genie
          notebook_task:
            notebook_path: ./src/deploy/grant_app_uc.py
            base_parameters:
              catalog:           ${resources.schemas.demo_schema.catalog_name}
              schema:            ${resources.schemas.demo_schema.name}
              app_name:          ${var.app_name}
              genie_space_id:    "{{tasks.deploy_genie.values.genie_space_id}}"
          environment_key: sdk_latest

        # Every resolved id → <catalog>.<schema>.demo_resources (read by the app at boot) + the job's exit JSON.
        - task_key: export_resources
          depends_on:
            - task_key: grant_app_uc
          notebook_task:
            notebook_path: ./src/deploy/export_resources.py
            base_parameters:
              app_name:          ${var.app_name}
              catalog:           ${resources.schemas.demo_schema.catalog_name}
              schema:            ${resources.schemas.demo_schema.name}
              dashboard_id:      ${resources.dashboards.luxebeauty_dashboard.id}
              pipeline_id:       ${resources.pipelines.luxebeauty_pipeline.id}
              warehouse_id:      ${var.warehouse_id}
              lakebase_project:  ${var.lakebase_project_slug}
              agent_mlflow_experiment_path: ${resources.experiments.agent_traces.name}
              genie_space_id:    "{{tasks.deploy_genie.values.genie_space_id}}"
              documents_volume:  "{{tasks.deploy_genie.values.documents_volume}}"
          environment_key: sdk_latest

      environments:
        - environment_key: sdk_default
          spec:
            client: "4"
            dependencies:
              - "faker"
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - "xgboost"
              - "scikit-learn"
              - "mlflow>=2.13.0"
        # Genie Agent (tables + documents volume) — SDK > 0.114.0.
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - "databricks-sdk>=0.114.0"
