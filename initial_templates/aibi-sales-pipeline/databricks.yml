# Databricks Asset Bundle — AI/BI Sales Pipeline Review (no app, no Lakebase).
#
# Re-creates the whole demo from scratch on any workspace:
#   1. `databricks bundle deploy` — creates the schema + dashboard shells + setup job.
#   2. `databricks bundle run sales_pipeline_setup` — generates data + builds the
#      medallion (generate_data.py) and deploys the Genie space.
# The dashboard is a DAB `dashboards` resource; its datasets are rebound to the
# target catalog/schema via dataset_catalog / dataset_schema (needs CLI >= 0.283.0).
#
# Deploy is documented in dab_instructions.md — do NOT run it as part of authoring.
bundle:
  name: aibi-sales-pipeline

variables:
  catalog:
    description: Unity Catalog for the demo.
    default: dbdemos_templates
  schema:
    description: Schema for the demo tables, dashboard, and Genie space.
    default: aibi_sales_pipeline
  warehouse_id:
    description: SQL warehouse the dashboard + Genie space use.
  workspace_folder:
    description: Workspace folder that holds the dashboard + Genie space (also the bundle root_path).
    default: ${workspace.resource_path}

resources:
  schemas:
    demo_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "AI/BI Sales Pipeline Review demo — synthetic data, dashboard, Genie."

  dashboards:
    sales_pipeline_dashboard:
      display_name: "AI-BI - Sales Pipeline Review"  # no "/" : a dashboard with a parent_path is a workspace item
      file_path: ./dashboard/dashboard.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.workspace_folder}
      embed_credentials: true
      # Rebind the dashboard's datasets to the deployed catalog/schema. Every dataset is schema-less SQL - including
      # ds_metrics, which queries the metrics_sales metric view (a metric-view `asset_name` must be fully qualified and
      # is NOT rewritten by dataset_catalog/dataset_schema, so it would pin one catalog).
      dataset_catalog: ${var.catalog}
      dataset_schema: ${resources.schemas.demo_schema.name}

  jobs:
    sales_pipeline_setup:
      name: "[AI/BI] Sales Pipeline Review — setup (${var.catalog}.${var.schema})"  # unique name in the workspace
      tasks:
        - task_key: generate_data_and_build
          spark_python_task:
            python_file: ./data_generation/generate_data.py
            parameters:
              - "--catalog"
              - ${var.catalog}
              - "--schema"
              - ${resources.schemas.demo_schema.name}
          environment_key: sdk_default
        - task_key: deploy_genie
          depends_on:
            - task_key: generate_data_and_build
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${resources.schemas.demo_schema.name}
              warehouse_id: ${var.warehouse_id}
              parent_path: ${var.workspace_folder}
          environment_key: sdk_latest
      environments:
        - environment_key: sdk_default
          spec:
            client: "4"
            dependencies:
              - numpy
              - pandas
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - databricks-sdk>=0.114.0

targets:
  # Portable generic targets (Solution Builder forks / "Download DAB"): NO pinned host, so they deploy to whatever
  # workspace your profile points at; pass --var catalog/schema/warehouse_id. Dashboard + Genie land in the bundle folder.
  dev:
    mode: development
    default: true
  prod:
    mode: production
