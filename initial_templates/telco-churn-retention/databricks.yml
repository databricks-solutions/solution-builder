# Veridian Mobile — Churn Retention Desk — complete DAB. Recreates the whole demo on ANY workspace / catalog / schema
# (everything is a variable), from an EMPTY schema. Nothing is created by hand:
#
#   databricks bundle deploy  → schema + Lakebase database + AI/BI dashboard + app (resource) + agent-traces experiment
#                               + setup job
#   databricks bundle run churn_retention_setup
#       generate_data (synthetic accounts, network, billing, care calls, port-outs, offers, gold)
#       → transcript_insights (AI Functions over the care-call transcripts, on the SQL warehouse)
#       → train_churn_model (XGBoost + SHAP, UC model @champion, customer_features + churn_scores)
#       → deploy_genie → grant_app (UC + Genie permissions for the app SP)
#       → export_resources (<catalog>.<schema>.demo_resources, which the app reads at boot + exit JSON)
#   databricks bundle run churn_retention_app   → deploys the app source and starts it
#
# See dab_instructions.md.
bundle:
  name: telco-churn-retention

variables:
  catalog:
    description: Unity Catalog catalog for the demo
    default: telecommunications
  schema:
    description: Schema for all demo tables + the UC model
    default: churn_retention_copilot
  warehouse_id:
    description: SQL warehouse for the dashboard, AI Functions, Genie and the app
  workspace_folder:
    description: Workspace folder holding the bundle, dashboard, Genie space and MLflow experiments
    default: /Workspace/Users/${workspace.current_user.userName}/telco-churn-retention
  app_name:
    description: Databricks App name (unique per workspace, <= 30 chars)
    default: churn-retention-copilot
  lakebase_project_slug:
    description: Existing Lakebase (autoscaling) project the app database lives in
  lakebase_branch_id:
    default: production
  lakebase_database:
    description: Postgres database name created by the bundle for the app
  lakebase_database_id:
    description: Lakebase database resource id (RFC1123, unique in the project)
  lakebase_owner_role:
    description: >-
      Postgres role id (on the branch) that owns the database. Non-personal: a GROUP role for the
      workspace `admins` group, created once per Lakebase project (see dab_instructions.md).

workspace:
  root_path: ${var.workspace_folder}/.bundle/${bundle.target}

artifacts:
  app:
    build: ./app/scripts/build-app.sh

sync:
  include:
    - "src/**"
    - "genie/**"
    - "app/dist/**"
    - "app/client/dist/**"
    - "app/drizzle/**"
    - "app/package.json"        # the repo-root .gitignore ignores package*.json — the Apps
    - "app/package-lock.json"   # container needs both to npm install
  exclude:
    - "app/node_modules/**"
    - "app/.env"
    - "app/.env.*"
    - "app/.preview.pgid"
    - "app/.databricks/**"
    - "app/playwright-report/**"
    - "app/test-results/**"
    - "app/tests/**"
    - "template_screenshot*.png"

targets:
  # Portable default (forks / "Download DAB"): NO pinned host — deploys to whatever workspace the profile points at.
  # Pass the workspace-specific values: --var catalog=… --var schema=… --var warehouse_id=… --var lakebase_project_slug=…
  # (+ --var lakebase_owner_role=… if the project has no `admins` role). Bundle files, dashboard, Genie space and
  # experiments land under the deployer's home folder.
  dev:
    default: true
    mode: development
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}   # mode: development requires a per-user root
    variables:
      workspace_folder: /Workspace/Users/${workspace.current_user.userName}/telco-churn-retention
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      workspace_folder: /Workspace/Users/${workspace.current_user.userName}/telco-churn-retention

resources:
  schemas:
    demo_schema:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: "Veridian Mobile churn retention desk demo (fictional carrier)."

  experiments:
    agent_traces:
      # The app's agent traces (MLflow tracing). Bundle-owned so it lives in the demo folder and the app SP gets
      # CAN_EDIT through the app resource below (the SP can't create experiments in a folder it doesn't own).
      name: ${var.workspace_folder}/${var.app_name}-agent-traces

  postgres_databases:
    churn_retention_db:
      parent: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
      database_id: ${var.lakebase_database_id}
      postgres_database: ${var.lakebase_database}
      role: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}/roles/${var.lakebase_owner_role}

  dashboards:
    cmo_dashboard:
      display_name: "Veridian Mobile - Churn and Retention (CMO)"
      file_path: ./dashboard/dashboard.lvdash.json
      warehouse_id: ${var.warehouse_id}
      parent_path: ${var.workspace_folder}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${resources.schemas.demo_schema.name}
      embed_credentials: true

  apps:
    churn_retention_app:
      name: ${var.app_name}
      description: "Veridian Mobile Retention Desk — churn-risk model, AI-analyzed care calls and a next-best-offer copilot inside margin guardrails"
      source_code_path: ./app
      config:
        command: ["node", "--env-file-if-exists=.env", "dist/server.js"]
        env:
          - name: NODE_ENV
            value: production
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: WAREHOUSE_ID
            value_from: sql-warehouse
          - name: LAKEBASE_ENDPOINT
            value_from: postgres
          - name: DEMO_CATALOG
            value: ${var.catalog}
          - name: DEMO_SCHEMA
            value: ${resources.schemas.demo_schema.name}
          - name: DASHBOARD_ID
            value: ${resources.dashboards.cmo_dashboard.id}
          - name: AGENT_MLFLOW_EXPERIMENT_PATH
            value: ${resources.experiments.agent_traces.name}
          - name: LAKEBASE_PROJECT_ID
            value: ${var.lakebase_project_slug}
          # GENIE_SPACE_ID is NOT set here: the setup job creates the space and writes its id to
          # <catalog>.<schema>.demo_resources, which the app reads at boot (server/services/resources.ts).
      user_api_scopes:
        - serving.serving-endpoints
        - ai-gateway
        - dashboards.genie
        - sql
        - sql.statement-execution
        - postgres
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_slug}/branches/${var.lakebase_branch_id}
            database: ${resources.postgres_databases.churn_retention_db.name}
            permission: CAN_CONNECT_AND_CREATE
        - name: agent-traces
          experiment:
            experiment_id: ${resources.experiments.agent_traces.id}
            permission: CAN_EDIT

  jobs:
    churn_retention_setup:
      name: "[Veridian] Churn Retention Desk — setup"
      description: "Synthetic data → AI Functions over care calls → churn model (UC, SHAP drivers) → Genie → app grants → demo_resources"
      tasks:
        - task_key: generate_data
          spark_python_task:
            python_file: ./data_generation/generate_data.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${resources.schemas.demo_schema.name}"]
          environment_key: default
        - task_key: transcript_insights
          depends_on: [{task_key: generate_data}]
          spark_python_task:
            python_file: ./src/deploy/run_sql_on_warehouse.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${resources.schemas.demo_schema.name}",
                         "--warehouse_id", "${var.warehouse_id}", "--sql_file", "${workspace.file_path}/src/ai/transcript_insights.sql"]
          environment_key: sdk
        - task_key: train_churn_model
          depends_on: [{task_key: generate_data}]
          spark_python_task:
            python_file: ./src/ml/train_churn_model.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${resources.schemas.demo_schema.name}",
                         "--experiment", "${var.workspace_folder}/churn_risk_model_experiment"]
          environment_key: ml
        - task_key: deploy_genie
          depends_on: [{task_key: transcript_insights}, {task_key: train_churn_model}]
          spark_python_task:
            python_file: ./src/deploy/deploy_genie.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${resources.schemas.demo_schema.name}",
                         "--warehouse_id", "${var.warehouse_id}", "--parent_path", "${var.workspace_folder}",
                         "--space_json", "${workspace.file_path}/genie/genie_space.json"]
          environment_key: sdk
        - task_key: grant_app
          depends_on: [{task_key: deploy_genie}]
          spark_python_task:
            python_file: ./src/deploy/grant_app_uc.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${resources.schemas.demo_schema.name}",
                         "--app_name", "${var.app_name}", "--warehouse_id", "${var.warehouse_id}",
                         "--genie_space_id", "{{tasks.deploy_genie.values.genie_space_id}}"]
          environment_key: sdk
        - task_key: export_resources
          depends_on: [{task_key: grant_app}]
          spark_python_task:
            python_file: ./src/deploy/export_resources.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${resources.schemas.demo_schema.name}",
                         "--app_name", "${var.app_name}", "--dashboard_id", "${resources.dashboards.cmo_dashboard.id}",
                         "--warehouse_id", "${var.warehouse_id}", "--genie_space_id", "{{tasks.deploy_genie.values.genie_space_id}}",
                         "--agent_mlflow_experiment_path", "${resources.experiments.agent_traces.name}"]
          environment_key: default
      environments:
        - environment_key: default
          spec: {client: "4", dependencies: ["numpy", "pandas"]}
        - environment_key: ml
          spec: {client: "4", dependencies: ["xgboost", "scikit-learn", "mlflow>=3.1"]}
        - environment_key: sdk
          spec: {client: "4", dependencies: ["databricks-sdk>=0.114.0"]}
