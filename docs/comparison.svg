<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="bBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="bGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="bGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="bShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="320" fill="url(#bBg)"/>

  <!-- Title -->
  <text x="500" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Done the Databricks way — every time.</text>
  <text x="500" y="80" text-anchor="middle" font-size="14" fill="#64748B">No shortcuts. No improvisation. No surprises in production.</text>

  <!-- Glow behind medal -->
  <ellipse cx="280" cy="200" rx="160" ry="100" fill="url(#bGlow)"/>

  <!-- Gold medal -->
  <g transform="translate(280, 200)">
    <g filter="url(#bShadow)">
      <circle r="78" fill="url(#bGold)"/>
      <circle r="64" fill="#FBBF24" opacity="0.55"/>
      <circle r="54" fill="url(#bGold)"/>
      <!-- star -->
      <path d="M 0 -30 L 9 -9 L 32 -7 L 14 8 L 19 30 L 0 19 L -19 30 L -14 8 L -32 -7 L -9 -9 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Three promises -->
  <g transform="translate(520, 130)">
    <!-- Promise 1 -->
    <g>
      <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>
      <path d="M 12 20 l 5 5 l 11 -11" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="18" font-size="16" font-weight="700" fill="#0F172A">Reliable</text>
      <text x="52" y="35" font-size="12" fill="#64748B">The right patterns, automatically applied.</text>
    </g>
    <!-- Promise 2 -->
    <g transform="translate(0, 60)">
      <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>
      <path d="M 12 20 l 5 5 l 11 -11" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="18" font-size="16" font-weight="700" fill="#0F172A">Governed</text>
      <text x="52" y="35" font-size="12" fill="#64748B">Unity Catalog and ownership, by default.</text>
    </g>
    <!-- Promise 3 -->
    <g transform="translate(0, 120)">
      <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>
      <path d="M 12 20 l 5 5 l 11 -11" stroke="#D97706" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="18" font-size="16" font-weight="700" fill="#0F172A">Yours</text>
      <text x="52" y="35" font-size="12" fill="#64748B">Inspectable code in your workspace.</text>
    </g>
  </g>
</svg>
