<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="pBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="pAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="pBrick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B47"/>
      <stop offset="100%" stop-color="#E83A1F"/>
    </linearGradient>
    <linearGradient id="pGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="pCard" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#B45309" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1000" height="340" fill="url(#pBg)"/>

  <!-- Title + gold-standard pill -->
  <text x="500" y="48" text-anchor="middle" font-size="26" font-weight="800" fill="#0F172A">Done the Databricks way — every time.</text>
  <g transform="translate(500, 66)">
    <rect x="-155" y="0" width="310" height="30" rx="15" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <g transform="translate(-133, 15)" fill="#D97706">
      <path d="M 0 -8 L 2.4 -2.5 L 8 -2 L 3.6 2 L 5 8 L 0 4.8 L -5 8 L -3.6 2 L -8 -2 L -2.4 -2.5 Z"/>
    </g>
    <text x="8" y="20" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B45309">Best practices, by construction</text>
  </g>

  <!-- ===== Card 1: Reliable ===== -->
  <g transform="translate(42, 124)">
    <rect width="290" height="164" rx="18" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5" filter="url(#pCard)"/>
    <rect x="28" y="28" width="52" height="52" rx="14" fill="url(#pAmber)"/>
    <g transform="translate(54, 54)">
      <path d="M 0 -17 L 13 -11 V 1 C 13 10 7 16 0 20 C -7 16 -13 10 -13 1 V -11 Z" fill="#FFFFFF"/>
      <path d="M -6 0 l 4 5 l 8 -9" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="28" y="112" font-size="20" font-weight="800" fill="#0F172A">Reliable</text>
    <text x="28" y="134" font-size="13" fill="#64748B">The right patterns, applied</text>
    <text x="28" y="152" font-size="13" fill="#64748B">automatically — no improvising.</text>
  </g>

  <!-- ===== Card 2: Governed ===== -->
  <g transform="translate(355, 124)">
    <rect width="290" height="164" rx="18" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5" filter="url(#pCard)"/>
    <rect x="28" y="28" width="52" height="52" rx="14" fill="url(#pBrick)"/>
    <g transform="translate(54, 54)" fill="#FFFFFF">
      <path d="M -7 -3 v -3 a 7 7 0 0 1 14 0 v 3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="-10" y="-3" width="20" height="17" rx="3.5"/>
      <circle cx="0" cy="4" r="2.4" fill="#E83A1F"/>
      <rect x="-1.4" y="4" width="2.8" height="6" rx="1.4" fill="#E83A1F"/>
    </g>
    <text x="28" y="112" font-size="20" font-weight="800" fill="#0F172A">Governed</text>
    <text x="28" y="134" font-size="13" fill="#64748B">Unity Catalog, ownership,</text>
    <text x="28" y="152" font-size="13" fill="#64748B">and lineage — by default.</text>
  </g>

  <!-- ===== Card 3: Yours ===== -->
  <g transform="translate(668, 124)">
    <rect width="290" height="164" rx="18" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" filter="url(#pCard)"/>
    <rect x="28" y="28" width="52" height="52" rx="14" fill="url(#pGreen)"/>
    <g transform="translate(54, 54)" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -6 -9 L -15 0 L -6 9"/>
      <path d="M 6 -9 L 15 0 L 6 9"/>
      <path d="M 2 -11 L -2 11"/>
    </g>
    <text x="28" y="112" font-size="20" font-weight="800" fill="#0F172A">Yours</text>
    <text x="28" y="134" font-size="13" fill="#64748B">Real code in your workspace —</text>
    <text x="28" y="152" font-size="13" fill="#64748B">inspect it, edit it, keep it.</text>
  </g>
</svg>
