<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="dBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="dGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="dAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="dBrick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B47"/>
      <stop offset="100%" stop-color="#E83A1F"/>
    </linearGradient>
    <radialGradient id="dGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <filter id="dShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="380" fill="url(#dBg)"/>

  <!-- Title -->
  <text x="500" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Bring your own data, or start with ours.</text>
  <text x="500" y="82" text-anchor="middle" font-size="14" fill="#64748B">Same engine. Same patterns. Same result.</text>

  <!-- Glow behind merge -->
  <ellipse cx="730" cy="230" rx="170" ry="90" fill="url(#dGlow)"/>

  <!-- Converging dashed paths -->
  <path d="M 170 175 Q 420 175 600 225" stroke="#FED7AA" stroke-width="3" stroke-dasharray="6 8" fill="none" stroke-linecap="round"/>
  <path d="M 170 285 Q 420 285 600 235" stroke="#A7F3D0" stroke-width="3" stroke-dasharray="6 8" fill="none" stroke-linecap="round"/>

  <!-- ===== Top source: Synthetic ===== -->
  <g transform="translate(110, 175)">
    <g filter="url(#dShadow)">
      <circle r="50" fill="#FFFFFF" stroke="#FED7AA" stroke-width="2"/>
      <!-- sparkle glyph for "synthetic / magic / generated" -->
      <g transform="translate(0, 0)" fill="url(#dAmber)">
        <path d="M 0 -22 L 5 -6 L 21 -1 L 5 4 L 0 20 L -5 4 L -21 -1 L -5 -6 Z"/>
      </g>
    </g>
    <text x="76" y="-4" font-size="18" font-weight="700" fill="#0F172A">Synthetic</text>
    <text x="76" y="18" font-size="13" fill="#64748B">Instant. Realistic.</text>
  </g>

  <!-- ===== Bottom source: Your data ===== -->
  <g transform="translate(110, 285)">
    <g filter="url(#dShadow)">
      <circle r="50" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
      <!-- folder glyph -->
      <g transform="translate(-22, -22)" fill="url(#dGreen)">
        <path d="M 4 12 L 4 38 a 4 4 0 0 0 4 4 h 28 a 4 4 0 0 0 4 -4 v -22 a 4 4 0 0 0 -4 -4 h -16 l -4 -4 h -8 a 4 4 0 0 0 -4 4 z"/>
        <rect x="10" y="22" width="24" height="2.5" rx="1.2" fill="#FFFFFF"/>
        <rect x="10" y="28" width="18" height="2.5" rx="1.2" fill="#FFFFFF"/>
        <rect x="10" y="34" width="22" height="2.5" rx="1.2" fill="#FFFFFF"/>
      </g>
    </g>
    <text x="76" y="-4" font-size="18" font-weight="700" fill="#0F172A">Your data</text>
    <text x="76" y="18" font-size="13" fill="#64748B">Real. Production-ready.</text>
  </g>

  <!-- ===== Merge: one outcome ===== -->
  <g transform="translate(760, 230)">
    <g filter="url(#dShadow)">
      <circle r="76" fill="url(#dBrick)"/>
      <g transform="translate(0, 0)" fill="#FFFFFF">
        <!-- big sparkle -->
        <path d="M 0 -30 L 6 -10 L 26 -4 L 6 2 L 0 22 L -6 2 L -26 -4 L -6 -10 Z"/>
        <path d="M 22 -22 L 24 -14 L 32 -12 L 24 -10 L 22 -2 L 20 -10 L 12 -12 L 20 -14 Z" opacity="0.75"/>
      </g>
    </g>
    <text x="0" y="116" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">A solution that runs.</text>
  </g>
</svg>
