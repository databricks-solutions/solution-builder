<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="dBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="dGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="dAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="dBrick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B47"/>
      <stop offset="100%" stop-color="#E83A1F"/>
    </linearGradient>
    <radialGradient id="dGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <filter id="dShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dx="0" dy="5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="360" fill="url(#dBg)"/>

  <!-- Title -->
  <text x="500" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Bring your own data, or start with ours.</text>
  <text x="500" y="80" text-anchor="middle" font-size="14" fill="#64748B">Same engine. Same patterns. Same result.</text>

  <!-- Glow behind merge point -->
  <ellipse cx="690" cy="220" rx="160" ry="80" fill="url(#dGlow)"/>

  <!-- Two converging paths -->
  <path d="M 270 170 Q 460 170 590 215" stroke="#FED7AA" stroke-width="3" stroke-dasharray="6 8" fill="none" stroke-linecap="round"/>
  <path d="M 270 280 Q 460 280 590 235" stroke="#A7F3D0" stroke-width="3" stroke-dasharray="6 8" fill="none" stroke-linecap="round"/>

  <!-- Top source: synthetic -->
  <g transform="translate(160, 170)">
    <g filter="url(#dShadow)">
      <circle r="54" fill="#FFFFFF" stroke="#FED7AA" stroke-width="2"/>
      <g transform="translate(-22, -22)" fill="url(#dAmber)">
        <!-- seedling -->
        <path d="M 22 42 C 22 30 12 24 6 24 C 6 36 14 42 22 42 Z"/>
        <path d="M 22 42 C 22 30 32 24 38 24 C 38 36 30 42 22 42 Z"/>
        <rect x="20" y="38" width="4" height="8" rx="2"/>
      </g>
    </g>
    <text x="0" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Synthetic</text>
    <text x="0" y="104" text-anchor="middle" font-size="12" fill="#64748B">Instant. Realistic.</text>
  </g>

  <!-- Bottom source: your data -->
  <g transform="translate(160, 280)">
    <g filter="url(#dShadow)">
      <circle r="54" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
      <g transform="translate(-22, -22)" fill="url(#dGreen)">
        <!-- folder/data -->
        <path d="M 4 12 L 4 38 a 4 4 0 0 0 4 4 h 28 a 4 4 0 0 0 4 -4 v -22 a 4 4 0 0 0 -4 -4 h -16 l -4 -4 h -8 a 4 4 0 0 0 -4 4 z"/>
        <rect x="10" y="22" width="24" height="2.5" rx="1.2" fill="#FFFFFF"/>
        <rect x="10" y="28" width="18" height="2.5" rx="1.2" fill="#FFFFFF"/>
        <rect x="10" y="34" width="22" height="2.5" rx="1.2" fill="#FFFFFF"/>
      </g>
    </g>
    <text x="0" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Your data</text>
    <text x="0" y="104" text-anchor="middle" font-size="12" fill="#64748B">Real. Production-ready.</text>
  </g>

  <!-- Merge: one outcome -->
  <g transform="translate(720, 225)">
    <g filter="url(#dShadow)">
      <circle r="80" fill="url(#dBrick)"/>
      <g transform="translate(-26, -26)" fill="#FFFFFF">
        <!-- big sparkle -->
        <path d="M 26 0 L 31 19 L 50 24 L 31 29 L 26 48 L 21 29 L 2 24 L 21 19 Z"/>
        <path d="M 48 -2 L 50 6 L 58 8 L 50 10 L 48 18 L 46 10 L 38 8 L 46 6 Z" opacity="0.75"/>
      </g>
    </g>
    <text x="0" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">A solution that runs.</text>
  </g>
</svg>
