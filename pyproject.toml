[project]
name = "solution-builder-evaluation"
version = "0.1.0"
description = "Versioned test scenario contracts for Solution Builder"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
sb-eval = "evaluation.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests/evaluation"]
asyncio_mode = "auto"
