# Databricks App manifest — read by the runtime when the container starts.
#
# Lifecycle on the Apps container (in order):
#   1. `npm install` runs against the shipped lockfile. .npmrc has
#      `omit=dev` so only runtime deps install — fast and small.
#   2. `npm run build` runs. Our package.json's `build` script is a
#      no-op echo (the real build ran locally via scripts/build-app.sh
#      and dist/server.js + client/dist/ are shipped via DAB sync).
#      Apps platform requires this step to succeed; the no-op satisfies
#      it while avoiding tsdown/vite which aren't installed at runtime.
#   3. The `command:` below runs to start the server.

command: ['node', '--env-file-if-exists=.env', 'dist/server.js']

# Scopes minted into the user's OBO token (x-forwarded-access-token).
# Without `model-serving` here, calls to /serving-endpoints fail with
# "Provided OAuth token does not have required scopes: model-serving".
# Add scopes only as the demo needs them — each one requires user consent
# on first visit.
user_authorization:
  scopes:
    - model-serving      # OpenAI Agents loop hits /serving-endpoints/responses
    - genie              # ask_data → Genie space
    - sql                # warehouse-backed analytics queries
    - postgres           # Lakebase pool
    - ai-gateway         # AI Gateway routing for the Responses API
    - catalog.catalogs:read
    - catalog.schemas:read
    - catalog.tables:read

env:
  - name: NODE_ENV
    value: production

  # Interactive-deploy path (no databricks.yml DAB resource bindings):
  # runtime config comes from the .env file shipped with the source.
  # If you switch to a DAB-deploy flow, re-add `valueFrom: sql-warehouse`
  # / `valueFrom: postgres` entries here and wire the matching resources
  # in databricks.yml's apps.<name>.resources block.
