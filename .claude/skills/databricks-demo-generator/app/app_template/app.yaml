# Databricks App manifest — read by the runtime when the container starts.
#
# Lifecycle on the Apps container (in order):
#   1. `npm install` runs against the shipped lockfile. .npmrc has
#      `omit=dev` so only runtime deps install — fast and small.
#   2. `npm run build` runs. Our package.json's `build` script is a
#      no-op echo (the real build ran locally via scripts/build-app.sh
#      and dist/server.js + client/dist/ are shipped via DAB sync).
#      Apps platform requires this step to succeed; the no-op satisfies
#      it while avoiding tsdown/vite which aren't installed at runtime.
#   3. The `command:` below runs to start the server.

command: ['node', '--env-file-if-exists=.env', 'dist/server.js']

env:
  - name: NODE_ENV
    value: production

  # Resource bindings declared in databricks.yml's apps.<name>.resources
  # don't auto-inject env vars. AppKit expects each binding's fields to
  # be surfaced via `valueFrom` references here. The resource name on
  # the right MUST match the `name:` of the corresponding entry in the
  # bundle's `apps.<name>.resources:` list.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

  # ── Lakebase wiring ──────────────────────────────────────────────────
  # Apps' native `postgres:` resource binding rejects autoscaling
  # Lakebase project slugs ("Database instance X does not exist" /
  # "Field 'name' expects projects/.../databases/..." format) — its API
  # only knows legacy Provisioned Lakebase. Workaround: grant the App
  # SP CAN_CONNECT_AND_CREATE on the project via the Lakebase UI
  # out-of-band, and inject the connection params here directly.
  # AppKit's lakebase plugin reads these env vars to mint OAuth tokens.
  #
  # Replace these placeholders with the real Lakebase project values,
  # or remove the whole block if the demo doesn't use Lakebase.
  - name: PGHOST
    value: REPLACE_WITH_LAKEBASE_PGHOST  # e.g. ep-xxx.database.<region>.cloud.databricks.com
  - name: PGDATABASE
    value: REPLACE_WITH_DATABASE_NAME
  - name: LAKEBASE_ENDPOINT
    value: projects/REPLACE_PROJECT_ID/branches/production/endpoints/primary
  - name: PGPORT
    value: "5432"
  - name: PGSSLMODE
    value: require
