# Databricks Asset Bundle — standalone deploy of THIS app.
#
# Used when shipping the app on its own (no surrounding demo / pipeline /
# dashboard). For a full demo bundle (pipeline + dashboard + app together)
# see references/dab/example_databricks.yml in the demo-generator skill.
#
# One command deploys everything:
#
#   databricks bundle deploy
#
# `artifacts.default.build` runs scripts/build-app.sh first — installs
# npm deps, builds dist/ + client/dist/, and rewrites the lockfile so
# the App container can fetch packages from the public registry.

bundle:
  name: mas-chat-demo

# scripts/build-app.sh runs locally before sync. It does:
#   1. `npm install --include=dev`         — install build tooling
#   2. `npm run build:source`              — produce dist/ + client/dist/
#   3. scripts/strip-internal-registry.sh  — rewrite lockfile URLs
#                                            (Databricks proxy → public
#                                            registry; needed so the
#                                            App container can fetch).
artifacts:
  default:
    build: ./scripts/build-app.sh

# `dist/` and `client/dist/` are in .gitignore, so the bundle CLI would
# skip them during sync. Whitelist them here (the build script just
# produced them) so the App container has the pre-built server +
# client bundles to serve.
sync:
  include:
    - dist/**
    - client/dist/**

variables:
  app_name:
    description: "Databricks App name (must be unique per workspace)"
    default: "mas-chat-demo"
  warehouse_id:
    description: "SQL warehouse ID for the analytics plugin"

resources:
  apps:
    app:
      name: ${var.app_name}
      description: "Chatbot + dashboard + user menu"
      source_code_path: ./

      # Bindings — each entry's `name:` is what app.yaml's `valueFrom:`
      # references to populate the corresponding env var.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

        # NOTE: no `postgres` binding here even though AppKit's lakebase
        # plugin uses Postgres. The Apps `postgres:` resource binding
        # rejects autoscaling Lakebase project slugs (it only knows
        # legacy Provisioned Lakebase). Workaround: app.yaml hard-codes
        # PGHOST / PGDATABASE / LAKEBASE_ENDPOINT / PGPORT / PGSSLMODE
        # for the specific Lakebase project, and the App SP gets
        # CAN_CONNECT_AND_CREATE on that project granted manually via
        # the Lakebase UI.

      # Uncomment to grant the app on-behalf-of-user API scopes.
      # Available scopes: sql, dashboards.genie, files.files
      # user_api_scopes:
      #   - sql
      #   - dashboards.genie

      # Stateful: don't let `bundle destroy` wipe the deployed app
      # (its config often includes manual secret/permission setup).
      lifecycle:
        prevent_destroy: true

      permissions:
        - level: CAN_USE
          group_name: "users"

targets:
  default:
    default: true
