# NOTE: This databricks.yml represents what Stage 4 (DAB packager) would generate for a
# fully-built loyalty-segmentation demo. The upstream template this worked example starts
# from is Stage 1-2 (prompt) only — the `resources/` files referenced by `include` below
# would be generated by Stage 4 from the built workspace resources. They are intentionally
# absent here; their placeholder paths show the expected structure for the handoff package.
#
# Shape: targets-pattern from templates/databricks.yml.patch.md Section 1.

bundle:
  name: loyalty-segmentation

include:
  - resources/*.yml
  # resources/ would normally contain:
  #   resources/jobs.yml          — loyalty-segmentation-job definition (orchestrates synth-gen + pipeline + validation)
  #   resources/pipelines.yml     — harvestly_loyalty SDP pipeline
  #   resources/dashboards.yml    — Harvestly Loyalty Cockpit dashboard
  #   resources/serving.yml       — Genie space + Knowledge Assistant + MAS endpoint bindings
  # These are generated by Stage 4. See specifications/ for what each resource does.

variables:
  run_with_synthetic_data:
    description: "yes = use bundled synthetic data generator; no = read from <client_catalog>.<client_schema>"
    default: "yes"
  client_catalog:
    description: "Your Unity Catalog catalog (where the demo will create tables)"
    default: "<your_catalog>"
  client_schema:
    description: "Your schema (created inside client_catalog if it doesn't exist)"
    default: "<your_schema>"
  warehouse_id:
    description: "SQL Warehouse ID for queries and dashboard"
    default: "<your_warehouse_id>"
  # Demo-specific variables (populated by Stage 4 from built workspace resources):
  # genie_space_id:
  #   description: "Genie Space ID for the Harvestly Loyalty Analytics space"
  #   default: "<your_genie_space_id>"
  # knowledge_assistant_id:
  #   description: "Knowledge Assistant ID for the Harvestly Marketing Playbook KA"
  #   default: "<your_knowledge_assistant_id>"

targets:
  # Default target — edit values below for your workspace, then:
  #   databricks bundle deploy
  #   databricks bundle run loyalty-segmentation-job
  #
  # Genie Code can auto-detect these via the `loyalty-segmentation-adaptation` skill —
  # ask it: "set this up for my workspace"
  client:
    default: true
    # Production mode (no resource-name prefixing). Do NOT set mode: development —
    # it prepends `dev_<username>_` to every DAB resource which breaks the client's
    # expected schema/job/pipeline names. See client-handoff.md Common Pitfalls.
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
    variables:
      client_catalog: "<your_catalog>"
      client_schema: "<your_schema>"
      warehouse_id: "<your_warehouse_id>"
      run_with_synthetic_data: "yes"
