# Complete DAB Example - All resources in one file
# Deploy: databricks bundle deploy --var="catalog=my_catalog" --var="schema=my_schema" --var="warehouse_id=abc123"
# Run:    databricks bundle run demo_setup
#
# KEY PATTERNS DEMONSTRATED:
# 1. Infrastructure (schemas, volumes) declared in YAML - created by `bundle deploy`
# 2. Static files (PDFs) synced via sync.include, then copied to volume by workflow task
# 3. Parallel tasks: tasks without depends_on run simultaneously
# 4. Task value passing: dbutils.jobs.taskValues.set() + {{tasks.*.values.*}}
# 5. SDK environments: sdk_latest (>=0.114.0) required for Genie/KA/MAS APIs
# 6. Dashboard dataset_catalog/dataset_schema: overrides catalog/schema at deploy time
# 7. (Optional) Lakebase Postgres project/branch/endpoint for stateful demos
# 8. (Optional) Databricks App with build hook + sync overrides + env injection

bundle:
  name: demo-bundle

# ══════════════════════════════════════════════════════════════════════════════
# ARTIFACTS — pre-deploy build hook (only needed when shipping a Databricks App)
# ══════════════════════════════════════════════════════════════════════════════
# Runs LOCALLY before sync. The build script:
#   1. `cd app && npm install --include=dev`  (build tooling installed)
#   2. `npm run build:source`                 (produces app/dist/ + app/client/dist/)
#   3. rewrite package-lock.json `resolved` URLs from the Databricks
#      internal proxy to the public registry — the App container can't
#      reach the internal proxy, so its own `npm install` would hang.
#
# Without this, `databricks bundle deploy` ships the app with no built dist/
# and a lockfile pointing at an unreachable proxy → the App container's
# `npm install` hangs ~8 min then fails with "Exit handler never called!".
#
# Drop this block if the demo doesn't ship an app.
artifacts:
  default:
    build: ./scripts/build-app.sh

# ══════════════════════════════════════════════════════════════════════════════
# SYNC — what gets uploaded to the workspace
# ══════════════════════════════════════════════════════════════════════════════
# `include` whitelists patterns past .gitignore. The app's dist/ + client/dist/
# are gitignored (build outputs); we override here so the App container has
# them after sync.
sync:
  include:
    - "src/**"
    - "pipeline/**"
    - "dashboard/**"
    - "raw_data/pdf/**"      # PDFs synced to workspace, copied to volume by task
    - "app/dist/**"          # server bundle (tsdown output, runs as dist/server.js)
    - "app/client/dist/**"   # client bundle (vite output, AppKit auto-serves it)

variables:
  catalog:
    description: "Unity Catalog for demo resources"
  schema:
    description: "Schema within the catalog"
  warehouse_id:
    description: "SQL Warehouse ID for Genie Space"

  # ── (Optional) Variables for the Databricks App + Lakebase blocks below ──
  # Drop these (and the corresponding `apps:` / `postgres_*:` resources) if
  # the demo doesn't ship an app or doesn't need Postgres.
  app_name:
    description: "Workspace app name (must be unique per workspace)"
    default: "demo-app"
  # Lakebase: default to the shared `dbdemos-asset-generator` project — each
  # demo gets its own database inside it (saves the workspace's per-project
  # quota). Override `lakebase_project_id` if a demo needs a dedicated project.
  lakebase_project_id:
    description: "Lakebase project — reused if it already exists"
    default: "dbdemos-asset-generator"
  lakebase_branch_id:
    description: "Lakebase branch within the project"
    default: "production"
  lakebase_database_name:
    description: "Postgres database name. Convention: dbgen_<demo_short_name>"
    default: "dbgen_demo"
  lakebase_database_id:
    description: |
      Lakebase database resource ID (slug used in the App's `postgres`
      binding path). Convention: `db-` + database_name with underscores
      replaced by hyphens. app/scripts/lakebase_setup_db.sh passes this to
      `--database-id` when creating the database.
    default: "db-dbgen-demo"
  genie_space_id:
    description: "Existing Genie Space ID to bind into the app (leave empty to skip)"
    default: ""

targets:
  dev:
    default: true
    mode: development
    # Workspace from DATABRICKS_HOST env or ~/.databrickscfg profile

  prod:
    mode: production

# ============================================================================
# RESOURCES - All in one file for clarity
# ============================================================================

resources:
  # ══════════════════════════════════════════════════════════════════════════
  # PATTERN: Infrastructure in YAML (not Python)
  # Schemas and volumes are created by `bundle deploy`, NOT by Python scripts.
  # This ensures they exist BEFORE workflow tasks run.
  # ══════════════════════════════════════════════════════════════════════════
  schemas:
    demo_schema:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: "Demo schema"
      grants:
        - principal: "users"
          privileges:
            - USE_SCHEMA

  volumes:
    raw_data:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: "raw_data"
      volume_type: "MANAGED"
      comment: "Raw data files for pipeline"
      grants:
        - principal: "users"
          privileges:
            - READ_VOLUME

    docs:
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}
      name: "docs"
      volume_type: "MANAGED"
      comment: "PDF documents for Knowledge Assistant"

  # --------------------------------------------------------------------------
  # PIPELINE: Spark Declarative Pipeline (SDP/DLT)
  # --------------------------------------------------------------------------
  pipelines:
    demo_pipeline:
      name: "[${bundle.target}] Demo Pipeline"
      catalog: ${var.catalog}
      target: ${var.schema}
      libraries:
        - notebook:
            path: ./pipeline/01_bronze.py
        - notebook:
            path: ./pipeline/02_silver.sql
        - notebook:
            path: ./pipeline/03_gold.sql
      # Pass catalog/schema to Python DLT for dynamic volume paths
      configuration:
        demo.catalog: ${var.catalog}
        demo.schema: ${var.schema}
      serverless: true
      continuous: false
      development: true
      channel: current
      permissions:
        - level: CAN_VIEW
          group_name: "users"

  # --------------------------------------------------------------------------
  # DASHBOARD: AI/BI Lakeview Dashboard
  # IMPORTANT: Requires Databricks CLI v0.283.0+ for dataset_catalog/dataset_schema.
  # These fields rewrite ALL dataset queries to use ${var.catalog}.${var.schema}
  # at deploy time, so dashboards work across any target catalog/schema.
  # --------------------------------------------------------------------------
  dashboards:
    demo_dashboard:
      display_name: "[${bundle.target}] Demo Dashboard"
      file_path: ./dashboard/demo.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: ${var.schema}
      permissions:
        - level: CAN_RUN
          group_name: "users"

  # --------------------------------------------------------------------------
  # WORKFLOW: Main setup job with parallel tasks
  # --------------------------------------------------------------------------
  jobs:
    demo_setup:
      name: "[${bundle.target}] Demo Setup"
      description: "Uploads files, generates data, runs pipeline, deploys agents"

      tasks:
        # ── PARALLEL START: upload_pdfs and generate_data run together ──────

        # Task 1a: Upload PDFs from workspace to UC volume
        - task_key: upload_pdfs
          description: "Copy PDFs from synced workspace to UC volume"
          notebook_task:
            notebook_path: ./src/deploy/upload_pdfs.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: sdk_only

        # Task 1b: Generate synthetic data (runs in parallel with upload_pdfs)
        - task_key: generate_data
          description: "Generate demo tables"
          notebook_task:
            notebook_path: ./src/data_generation/generate_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: sdk_only

        # ── SEQUENTIAL: Pipeline after data, agents after their dependencies ──

        # Task 2: Run SDP pipeline
        - task_key: run_pipeline
          depends_on:
            - task_key: generate_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.demo_pipeline.id}

        # Task 3: Deploy Genie Space (after tables exist)
        # Outputs: genie_space_id via taskValues
        - task_key: deploy_genie
          depends_on:
            - task_key: run_pipeline
          notebook_task:
            notebook_path: ./src/deploy/deploy_genie.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              warehouse_id: ${var.warehouse_id}
          environment_key: sdk_latest  # REQUIRED: SDK >= 0.114.0

        # Task 4: Deploy Knowledge Assistant (after PDFs uploaded)
        # Outputs: ka_tile_id via taskValues
        - task_key: deploy_ka
          depends_on:
            - task_key: upload_pdfs
          notebook_task:
            notebook_path: ./src/deploy/deploy_ka.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: sdk_latest  # REQUIRED: SDK >= 0.114.0

        # Task 5: Deploy Multi-Agent Supervisor (after both Genie and KA)
        # Receives IDs from upstream tasks via task value passing
        - task_key: deploy_mas
          depends_on:
            - task_key: deploy_genie
            - task_key: deploy_ka
          notebook_task:
            notebook_path: ./src/deploy/deploy_mas.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              genie_space_id: "{{tasks.deploy_genie.values.genie_space_id}}"
              ka_tile_id: "{{tasks.deploy_ka.values.ka_tile_id}}"
          environment_key: sdk_latest  # REQUIRED: SDK >= 0.114.0

      # ══════════════════════════════════════════════════════════════════════
      # ENVIRONMENTS: SDK version matters!
      # The pre-installed SDK on Databricks serverless is too old for
      # Genie, Knowledge Assistant, and MAS APIs. Those tasks MUST use
      # sdk_latest with databricks-sdk>=0.114.0.
      # ══════════════════════════════════════════════════════════════════════
      environments:
        # Use for: data generation, file operations, basic SDK calls
        - environment_key: sdk_only
          spec:
            client: "4"

        # Use for: deploy_genie, deploy_ka, deploy_mas
        # CRITICAL: w.genie.list_spaces(), w.knowledge_assistants.* require >=0.114.0
        - environment_key: sdk_latest
          spec:
            client: "4"
            dependencies:
              - "databricks-sdk>=0.114.0"

      permissions:
        - level: CAN_VIEW
          group_name: "users"

  # ════════════════════════════════════════════════════════════════════════
  # OPTIONAL: Lakebase Postgres (autoscaling)
  # ────────────────────────────────────────────────────────────────────────
  # Only include this section if the demo needs a managed Postgres database
  # (e.g. powering an app's stateful workload).
  #
  # Three resources nest like a tree: project → branch → endpoint.
  #   - postgres_projects: the top-level container (tenant in Lakebase).
  #   - postgres_branches: a writable copy of the project's data. The CLI
  #     auto-creates a default `production` branch on first deploy if you
  #     don't declare one.
  #   - postgres_endpoints: the actual scalable PG compute attached to a
  #     branch. Suspension semantics are non-obvious — see comments below.
  #
  # The DATABASE inside the branch is NOT a DAB resource today (no
  # `postgres_databases` resource type as of CLI v0.299.1). The skill
  # template ships `app/scripts/lakebase_setup_db.sh` which creates the
  # project + branch + endpoint + database idempotently — run it once
  # before `databricks bundle deploy`. After deploy, run
  # `app/scripts/lakebase_grant_app_credential.sh` to grant the App SP role
  # CREATE on schema `public` (the binding only grants CONNECT — without
  # this Drizzle migrations fail with `pg=42501`).
  # ════════════════════════════════════════════════════════════════════════
  #
  # NOTE — when reusing the shared `dbdemos-asset-generator` project (the
  # default), DO NOT declare `postgres_projects:` here. The project
  # already exists workspace-wide; declaring it as a bundle resource
  # makes `bundle deploy` try to create it and fail. The setup script
  # is the only place that touches the project.
  #
  # Only declare `postgres_projects:` below if the demo needs a
  # DEDICATED Lakebase project (rare — most demos share). Same for
  # `postgres_branches:` / `postgres_endpoints:`.
  # ════════════════════════════════════════════════════════════════════════
  # postgres_projects:                              # uncomment for dedicated project
  #   main:
  #     project_id: ${var.lakebase_project_id}     # slug, e.g. "demo-lakebase"
  #     display_name: "Demo Lakebase"
  #     pg_version: 17
  #     # Suspension is configured on the auto-created production endpoint:
  #     #   - `suspend_timeout_duration: 300s` → endpoint scales to zero
  #     #     after 5 min idle (saves cost; first query pays a wake-up).
  #     #   - `no_suspension: true` is the OPT-OUT flag — set ONLY if you
  #     #     need always-on. Omitting it leaves the endpoint suspendable.
  #     default_endpoint_settings:
  #       suspend_timeout_duration: 300s
  #     # Lakebase projects are stateful; protect against `bundle destroy`
  #     # accidentally wiping production data.
  #     lifecycle:
  #       prevent_destroy: true

  # The default `production` branch is auto-created. Declare additional
  # branches here if the demo needs dev/staging copies. Example:
  # postgres_branches:
  #   dev:
  #     parent: ${resources.postgres_projects.main.id}
  #     branch_id: dev
  #     no_expiry: true     # default branches never expire; explicit dev
  #                         # branches default to a 7-day TTL unless set.

  # ════════════════════════════════════════════════════════════════════════
  # OPTIONAL: Databricks App
  # ────────────────────────────────────────────────────────────────────────
  # Native DAB resource (CLI 0.239.0+). The `resources:` block under the
  # app declares each downstream binding the app needs. The app's
  # service principal automatically gets the listed `permission` on
  # each binding.
  #
  # IMPORTANT — bindings ≠ env vars. The Apps platform does NOT
  # auto-inject env vars from these bindings. The app's `app.yaml`
  # (under source_code_path) must contain explicit env entries with
  # `valueFrom: <binding-name>` to surface each binding to the running
  # container. See app.yaml's env block in the corresponding template.
  #
  # Binding types: `genie_space`, `sql_warehouse`, `serving_endpoint`,
  # `postgres` (Lakebase autoscaling — note that `database:` MUST be a
  # full slugged resource path, see binding below), `secret`, `job`,
  # `uc_securable`.
  # ════════════════════════════════════════════════════════════════════════
  apps:
    demo_app:
      name: ${var.app_name}
      description: "Demo app powered by Genie + SQL warehouse + Lakebase"
      source_code_path: ./app           # path to app source (or `.` for repo root)

      # Stateful: don't let `bundle destroy` nuke the app — its config
      # often includes manual secrets/grants set after first deploy.
      lifecycle:
        prevent_destroy: true

      resources:
        # Genie Space binding (existing space — pass the id as a var).
        - name: genie-space
          genie_space:
            name: "Demo Genie Space"
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

        # SQL warehouse binding for any SQL the app issues.
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

        # Lakebase binding (autoscaling). Grants App SP
        # CAN_CONNECT_AND_CREATE and the platform auto-injects PGHOST /
        # PGDATABASE / PGSSLMODE / PGUSER / PGPORT / PGAPPNAME at
        # container start. Only LAKEBASE_ENDPOINT needs `valueFrom: postgres`
        # in app.yaml.
        #
        # `database:` MUST be the full slugged resource path (the API
        # rejects a plain DB name). The slug is created by
        # app/scripts/lakebase_setup_db.sh — pre-deploy step. After deploy,
        # run app/scripts/lakebase_grant_app_credential.sh to grant the SP
        # role CREATE on schema public.
        #
        # Drop this block if the demo doesn't use Lakebase.
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch_id}
            database: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch_id}/databases/${var.lakebase_database_id}
            permission: CAN_CONNECT_AND_CREATE

      permissions:
        - level: CAN_USE
          group_name: "users"
